# Git hooks via lefthook (https://lefthook.dev). A LOCAL safety net — CI is the
# authoritative gate. Bypass a run with `LEFTHOOK=0 git ...` or `git commit/push --no-verify`.
#
# Design for this repo (pnpm monorepo, heavy git-worktree automation):
#  - pre-commit: format (non-blocking, auto-fixed) + secretlint (BLOCKING — stops secret
#    and absolute home-dir path leaks before they enter git history).
#  - the real gate lives on pre-push, run only by the integrator who pushes — it mirrors
#    CI so a broken build / failing test / typecheck error is caught before it leaves the machine.
#
# Note that a correct config here is NOT sufficient: another tool appending its own block
# to .git/hooks/<name> makes ITS exit status the script's, silently reducing every command
# below to advisory (verify-git-hooks.mjs exists because that had actually happened).

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json}"
      run: pnpm biome format --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    secretlint:
      run: pnpm node_modules/.bin/secretlint --secretlintignore .secretlintignore {staged_files}
      fail_text: "secretlint found secrets or personal paths in staged files — fix before committing"

pre-push:
  parallel: true
  commands:
    # Cheap, and it answers "were the gates below actually enforced on the way
    # here?" — a hook whose exit status was hijacked lets every pre-commit run
    # pass silently, so this is checked at the last point before code leaves
    # the machine.
    git-hooks:
      run: pnpm verify:git-hooks
    typecheck:
      run: pnpm -r typecheck
    # No test run here, deliberately (user decision, 2026-09-05): full suites
    # are CI's job, and running one at push time was the same work twice —
    # the dev loop already ran the nearest-layer tests for what changed, and
    # CI (6min wall since the needs unchaining) runs everything. It was also
    # the gate the port-squatting flake bit, precisely because a full suite
    # under push-time load is a full suite on a saturated machine.
    noconsole:
      run: pnpm lint:noconsole
    # `pnpm lint` is one `biome check` over the repo, and ~62% of its CPU is the
    # GritQL plugins. Three interleaved with/without pairs, 3373 files, load
    # average 9-12: CPU time (user + sys) 50.2, 50.3, 49.1s with the four plugins
    # against 19.1, 18.8, 18.7s with `plugins: []` (mean 49.9 -> 18.9s); wall
    # 33.9, 27.7, 19.5s against 11.8, 13.5, 8.4s. All of it is one plugin:
    # `test-flake-shapes.grit` alone cost 49.6 and 48.2s of CPU in two runs, and
    # each of the other three alone cost the same as none (19.0-19.6s). It earns
    # that by matching on every test file, which is also why it is the one that
    # grows with the suite.
    lint:
      run: pnpm lint
    # ~1s, and it is the only check anywhere that notices the mutation lane
    # going stale. The lane covers a LIST of modules, so a new one is simply
    # not covered and the weekly report still looks healthy — the failure is
    # silence, which no other gate here can see. Failing at push time is the
    # right moment: whether the lane should cover the module is a decision for
    # the diff that adds it, not for whoever reads the report months later.
    mutation-lane:
      run: pnpm vitest run --project canvas-render-node packages/canvas-render/src/mutation-lane-coverage.test.ts
    # `file-size-budget` used to be a command of its own here, pinned to a file
    # in `packages/mcp-server`. The guard moved to `tools/arch-lint/src/`,
    # where it belongs by every criterion below, and the command went with it:
    # the whole project already runs, so a second entry naming one of its files
    # was one more path to keep in step for no extra coverage.
    #
    # Most of arch-lint's files scan the repo from OUTSIDE the package they
    # govern — the file-size budget, the sleep ledger, the lazy-import check,
    # the vocabulary check, the title check, the boundary and cycle scans — so
    # running the project you changed
    # never runs the guard that owns the rule you broke. Measured: a fixed
    # sleep added to an mcp-server test leaves `--project mcp-node` green at
    # 9/9 and fails `arch-lint-node`.
    #
    # This branch paid for that twice, both times a push that CI rejected: an
    # in-body dynamic import in a `mcp-server` test, then a fixed sleep in the
    # same package. `.claude/rules/dev-flow.md` records the gap in prose, which
    # is a rung that cannot notice being forgotten — and was not, by the person
    # who had written it down.
    #
    # A whole PROJECT rather than a file, and that is not a quiet exception to
    # "no test suite at push". The suite rule exists because a product suite
    # under push-time load is a saturated machine running timing-sensitive
    # code — which is how the port-squatting flake got in. This project runs no
    # product code, opens no port, starts no server and asserts on no clock; it
    # reads files. Scoping it to the files that scan other packages would be a
    # list to keep in step, which is the defect one level up.
    #
    # It is NOT free, and it is no longer hidden behind typecheck: the project
    # grew with every guard, where an early reading had it at 25-29s beside
    # typecheck's 39-43s. On a 4-core box it measures ~45s
    # standalone when quiet and takes a quiet pre-push from 72-86s to 103-138s,
    # so it is now the longest command and the critical path. Under the load of
    # several concurrent sessions two runs each measured 201-290s without it
    # and 335-400s with it — contention swings every number here by 2-4x, so the
    # invariant is "this is the slowest command and adds tens of seconds", not
    # any one reading. It stays because the failure it prevents is a push CI
    # rejects, and a push is rarer than a commit.
    #
    # The project now runs with `isolate: false` (its config says why that is
    # safe here and how it was checked). Three interleaved plain/no-isolate
    # pairs of the whole project, load average 17-27 on 4 cores: CPU time
    # (user + sys) 102.1s -> 54.2s, wall 145.6s -> 65.8s. The ~45s quiet and
    # 103-138s pre-push figures above predate it and were NOT re-taken, because
    # this box never went quiet: read them as upper bounds, and re-measure
    # before quoting any of them.
    arch-lint:
      run: pnpm vitest run --project arch-lint-node
