packages:
  - packages/*
  - apps/*
  - tools/*

# Centralized dependency version management (catalog).
# Deps shared across workspaces (packages/mcp-server + apps/web) are pinned ONCE
# here and referenced as `catalog:` in each package.json, so the versions can never
# drift apart. This is also the first line of defense against the pnpm "split
# instance" hazard for React (two copies of react/react-dom would break Context).
# Deps used by a single workspace stay inline in that package.json.
catalog:
  # react family — a single instance is mandatory (Provider/Consumer Context)
  react: "^19"
  react-dom: "^19"
  # the markdown code highlighter, shared by every surface that renders a
  # body: the editor, the read-only viewer, and export. One version, because
  # a scope-to-role table read against two different highlight.js releases is
  # a divergence nothing would report.
  "highlight.js": "^11.12.0"
  lowlight: "^3.3.0"
  # cross-process contract cores — one version everywhere
  zod: "^4.4.2"
  loro-crdt: "1.13.6"
  # shared build/test tooling
  typescript: "^6.0.3"
  vite: "^8.2.0"
  vitest: "^5.0.0"
  "@vitest/browser-playwright": "^5.0.0"
  # codec: OKF-Markdown remark/unified pipeline + YAML frontmatter
  unified: "^11.0.5"
  remark-parse: "^11.0.0"
  remark-stringify: "^11.0.0"
  remark-gfm: "^4.0.1"
  remark-math: "^6.0.0"
  yaml: "^2.8.4"
  # canvas-render: UAX #14 line breaking + CSS `line-break` (Japanese kinsoku).
  # One version everywhere, because a break-opportunity difference between the
  # browser and Node would desync the byte-identical-SVG guarantee.
  css-line-break: "^2.1.0"
  "@vitest/coverage-v8": "^5.0.0"
  # the html reporter and `vitest --ui`; the only surfaces that persist a
  # browser traceView replay (measured: the flag alone writes nothing).
  "@vitest/ui": "^5.0.0"
  # mcp-server's first InversifyJS composition root (DI wiring only, no
  # decorators/reflect-metadata) — pinned old enough to clear minimumReleaseAge.
  inversify: "^8.1.3"

# Supply-chain hardening: only install package versions published at least 7 days
# (10080 min) ago, so a compromised fresh release (npm account takeover / malicious
# publish) cannot be pulled in before it is detected and yanked. Applies to all deps
# including transitive. `--fix` will auto-add a security patch's minimum version to
# minimumReleaseAgeExclude when one is needed before the window elapses.
# Requires pnpm >= 10.16 (see packageManager in package.json).
minimumReleaseAge: 10080

# Security-patch escape hatch (see the comment above): versions listed here
# may be installed before the 7-day window elapses because they close a
# published advisory. Prune entries once they age past the window.
minimumReleaseAgeExclude:
  - js-yaml
  - fast-uri
  - ip-address
  # qs@6.16.0 closes GHSA-x5fp-wj9c-mxmx / GHSA-4mjr-xmp4-gh2g (published
  # 2026-08-29; prune once it ages past the window).
  - qs
  # NOT a security patch: a deliberate feature exception for the Vitest 5
  # major (published 2026-09-03, SLSA provenance attested on the registry),
  # taken so the test-stability work could land on it rather than wait the
  # window out. Self-expiring — prune on or after 2026-09-11, when 5.0.0 is
  # older than the window and these entries stop doing anything.
  - vitest
  - "@vitest/*"
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true

# Patched versions for known-vulnerable transitive deps. Moved here from the
# package.json "pnpm.overrides" key: pnpm v11 no longer reads settings from
# package.json's "pnpm" field (see https://pnpm.io/settings).
overrides:
  lodash-es@<4.18.0: ^4.18.0
  # GHSA-2v37-7h3g-55p8 (high): a custom generator loops forever at size 0,
  # cleared at 3.3.18. Reached only through postcss <- vite <- vitest, so it
  # never ships; the published runtime asks for nanoid ^6 and is unaffected.
  nanoid@<3.3.18: ^3.3.18
  nanoid@>=4.0.0 <5.0.9: ^5.0.9
  # GHSA-g7r4-m6w7-qqqr (low): the dev server serves arbitrary files on
  # Windows, cleared at 0.28.1. Reached only through vite <- vitest <-
  # stryker, and nobody runs that dev server; pinned anyway because the fix
  # is a patch within the same range vite already accepts.
  "esbuild@>=0.27.3 <0.28.1": ^0.28.1
  protobufjs@<8.6.6: ^8.6.6
  fast-uri@<3.1.6: ^3.1.6
  kysely@<0.28.17: ^0.28.17
  "@grpc/grpc-js@<1.14.4": ^1.14.4
  shell-quote@<1.9.0: ^1.9.0
  # Not a CVE bump like the rest — a DEDUPE. @libsql/kysely-libsql@0.4.1 is the
  # latest and still asks for @libsql/client@^0.8.0, which drags libsql@0.3.19
  # and its native bindings alongside the 0.17.3 the manifest declares. The
  # runtime loaded the OLD one, and its musl prebuild is what failed to load on
  # Alpine (`fcntl64: symbol not found`). @libsql/client@0.17.3 depends on
  # libsql@0.5.29 — the version this manifest's devDependency already names.
  "@libsql/client@<0.17.3": ^0.17.3
  uuid@<11.1.1: ^11.1.1
  # GHSA-x5fp-wj9c-mxmx + GHSA-4mjr-xmp4-gh2g: both cleared at 6.16.0 (reaches
  # the published runtime via express <- @modelcontextprotocol/sdk).
  qs@<6.16.0: ^6.16.0
  # GHSA-c83g-rgw3-j3cx + GHSA-73wf-gq98-2v4g (high): cleared at 4.28.7
  # (dev path via babel <- stryker; the alert pair still shows in the tab).
  browserslist@<4.28.7: ^4.28.7
  ip-address@<=10.3.0: '>=10.3.1'
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  ip-address@<=10.1.0: ^10.1.1
  body-parser@<2.3.0: ^2.3.0
  mermaid@<11.15.0: ^11.16.0
  dompurify@<3.4.12: ^3.4.12
  "@xmldom/xmldom@<0.9.12": ^0.9.12
  immutable@<4.3.9: ^4.3.9
  "@opentelemetry/propagator-jaeger@<2.9.0": ^2.9.0
  # Reached only through @huggingface/transformers, whose latest release
  # (4.2.0) still asks for `sharp ^0.34.5` and pulls adm-zip via
  # onnxruntime-node. The embedding runtime is an OPTIONAL peer so nothing
  # ships these by default, but a user who opts into semantic search would
  # install them — a real exposure, not a gate to silence. Neither package
  # is on a path this project enters: the embedder runs feature-extraction
  # over text, never sharp's image decoding or adm-zip's archive reading.
  # Drop each entry once transformers depends on a patched range itself.
  sharp@<0.35.0: ^0.35.0
  adm-zip@<0.6.0: ^0.6.0

# Advisories acknowledged as not applicable to this codebase. Each entry needs a
# reason and should be re-checked when the affected dependency is next touched.
auditConfig:
  ignoreGhsas:
    # react-router RSC-mode CSRF (patched only in >=8.3.0). apps/web is a Vite
    # SPA on react-router-dom 7.x and does not enable RSC mode, so the
    # vulnerable code path is unreachable. The v7 -> v8 migration is tracked as
    # a backlog item; remove this entry when react-router reaches >=8.3.0.
    - GHSA-qwww-vcr4-c8h2

# Multiple concurrent agent-driven git worktrees are routine in this repo;
# without this, pnpm materializes a full node_modules/.pnpm copy per
# worktree (~1GB each), which has caused real disk exhaustion. A shared
# global virtual store lets every worktree's node_modules symlink into one
# on-disk store instead of duplicating it. Requires pnpm >= 11.
enableGlobalVirtualStore: true

# GVS gives every global-store package its own node_modules/ containing only
# that package's *declared* dependencies (lockfileToDepGraph.ts). In standard
# mode, .pnpm/<depPath>/node_modules/ is instead a merged view that also
# includes the consumer's devDependencies as siblings — so a package that
# references a type or a runtime module without declaring it as a real
# dependency still resolves one under standard mode, but not under GVS.
#
# @secretlint/resolver hits exactly that gap: its tryResolve() falls back to
# `createRequire(import.meta.url).resolve(...)` scoped to @secretlint/resolver's
# own module location (no resolve hook is registered anywhere in this call
# chain), so every rule package configured in .secretlintrc.json (e.g.
# "@secretlint/secretlint-rule-pattern") must be a real sibling of
# @secretlint/resolver itself, not merely available somewhere in the
# workspace's devDependencies.
packageExtensions:
  # transformers.node.mjs imports onnxruntime-common directly while declaring
  # only onnxruntime-node, which owns it — the same undeclared-dependency gap
  # GVS exposes for @secretlint/resolver below.
  "@huggingface/transformers":
    dependencies:
      onnxruntime-common: "*"
  "@secretlint/resolver":
    dependencies:
      "@secretlint/secretlint-rule-pattern": "*"
      "@secretlint/secretlint-rule-preset-recommend": "*"

# pnpm v11 blocks all build scripts by default (security-by-default);
# allowBuilds is the v11 replacement for the removed onlyBuiltDependencies /
# neverBuiltDependencies / ignoredBuiltDependencies keys (see
# https://pnpm.io/settings#allowbuilds). Esbuild's postinstall (install.js)
# is load-bearing: on a cold store it resolves the platform-specific
# @esbuild/<platform> optionalDependency and hardlinks its native binary into
# bin/esbuild — without that, esbuild falls back to spawning the binary via a
# slower JS wrapper. pnpm already ignored build scripts for the deps below
# under pnpm 10 (verified: same "Ignored build scripts" warning appears on a
# clean pnpm 10 install), so only esbuild is allowed here — this preserves
# existing behavior rather than newly enabling native builds pnpm was already
# skipping.
allowBuilds:
  '@swc/core': false
  canvas: false
  esbuild: true
  lefthook: false
  libxmljs2: false
  msw: false
  onnxruntime-node: true
  sharp: false
  workerd: false

patchedDependencies:
  mdast-util-gfm-task-list-item@2.0.0: patches/mdast-util-gfm-task-list-item@2.0.0.patch
