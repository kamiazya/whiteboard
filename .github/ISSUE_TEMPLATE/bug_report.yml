name: Bug report
description: Report a reproducible bug in Whiteboard.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to file a bug report. Please fill out all required fields so we can reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps that reliably reproduce the issue.
      placeholder: |
        1. Run `pnpm mcp:http:dev`
        2. Open the web app, or call the MCP tool, that shows the problem
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Include error messages, stack traces, or screenshots.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version
      description: The `@kamiazya/whiteboard-mcp` version you are running (check your `package.json`, or run `npm ls @kamiazya/whiteboard-mcp`). Write `n/a` if you only used the hosted web app's browser keeper.
      placeholder: "e.g. 0.5.0"
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      description: Which runtime were you using when the bug happened?
      options:
        - Browser keeper (the hosted web app, workspace kept in the browser)
        - Local daemon (web app connected through the browser extension)
        - Server mode (self-hosted server)
        - MCP stdio (npx @kamiazya/whiteboard-mcp from an agent)
        - Other
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`. Leave blank for the browser keeper, which runs no Node process.
      placeholder: "e.g. v24.1.0"
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context, logs, or environment details that may help.
    validations:
      required: false
