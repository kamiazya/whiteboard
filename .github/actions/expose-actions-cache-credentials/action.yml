name: Expose Actions cache credentials
description: >-
  Hand the four environment variables Docker's `type=gha` cache backend falls
  back to (ACTIONS_RUNTIME_TOKEN, ACTIONS_CACHE_URL, ACTIONS_RESULTS_URL,
  ACTIONS_CACHE_SERVICE_V2) to later `run:` steps, which the runner otherwise
  provides only to JavaScript actions. The token is masked before anything can
  print it, and no value is ever written to the log.

runs:
  using: node24
  main: index.js
