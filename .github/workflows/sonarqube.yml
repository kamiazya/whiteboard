# SonarQube Cloud analysis — REPORT-ONLY, in its own workflow for that reason.
#
# It is deliberately NOT a job in ci.yml: every job there is listed in
# ci-gate's `needs` (ci-gate.test.ts fails on a missing one), and ci-gate is
# the single required check, so a Sonar job inside ci.yml would gate merges
# whether or not anyone decided it should. Living here keeps the decision
# explicit — turn it into a gate by adding the SonarQube Cloud check to branch
# protection, not by moving the job.
#
# What it measures that nothing else in this repo can: duplication, the
# maintainability/complexity ratings, and line coverage tracked over time.
# The scanner does NOT wait on the quality gate (no sonar.qualitygate.wait),
# so this job is green whenever the analysis uploaded; the verdict arrives as
# SonarQube Cloud's own PR check and comment.
#
# Configuration lives in sonar-project.properties, next to the exclusions it
# has to stay in sync with.
#
# It also ships the SAME lcov to DeepSource (.deepsource.toml), the other
# report-only lane, rather than paying for a second ~10-minute coverage run in
# a workflow of its own. The name stays `SonarQube` because renaming a
# workflow renames its checks; what it means is "the coverage-and-report-only
# lane". Deleting this file therefore turns OFF DeepSource's coverage too.
name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # The DeepSource CLI exchanges a GitHub OIDC token for temporary access, so
  # this lane needs no DEEPSOURCE_DSN secret at all.
  id-token: write

# A PR only cares about its latest push, so superseding an in-flight
# analysis there is right. The DEFAULT BRANCH is the opposite: its analysis
# is the project's record — the ratings, the issue counts, the coverage
# history — and cancelling it means main is never analysed at all while
# merges arrive faster than an analysis takes.
#
# Measured before this: six consecutive main analyses cancelled in a row,
# the newest push killing the previous run each time. The dashboard kept
# answering from an analysis over an hour old, and nothing said so — a
# cancelled run is not a failed one, so no check went red and no
# notification fired.
concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    # A pull request from a fork gets no secrets, so SONAR_TOKEN is empty and
    # the scan would fail on authentication after paying for a full coverage
    # run. Skip the job outright rather than spend ~10 minutes to fail.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar's "new code" period is decided from git history, and its
          # issue attribution from blame; a shallow clone has neither.
          fetch-depth: 0
          # Nothing here performs an authenticated git operation, and the job
          # installs and runs the tree's own tooling — keep the job token away
          # from it.
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every non-browser vitest project in one run, so v8 writes a single
      # merged tmp/coverage/lcov.info. Report-only means report-only: a failing
      # test here must not hide the analysis, which is still worth having.
      - name: Collect coverage
        continue-on-error: true
        run: pnpm coverage

      - uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # LAST on purpose: this step is allowed to fail the job (an upload that
      # silently does nothing is worse than a red report-only lane), and
      # failing here means Sonar's analysis has already been uploaded.
      #
      # A pinned archive and a checksum THIS REPO records, rather than the
      # `curl … | sh` the docs give. That installer reads both the version and
      # the expected hash from cli.deepsource.com's own manifest.json, so its
      # "Checksum verified" line rules out a corrupted download and nothing
      # else — and this job holds `id-token: write` over a checkout, so a
      # compromised host would be executing arbitrary code next to both.
      # Pinning the hash here means a substituted binary has to match a value
      # that is in git. Same reason every action above is pinned by SHA.
      #
      # Bumping it: read cli.deepsource.com/manifest.json for the new version
      # and its linux_amd64 sha256, and change both lines together.
      #
      # --commit is not optional either. On `pull_request`, checkout builds a
      # MERGE commit, and the CLI's git detection reports against that: the
      # upload succeeds, the step goes green, and DeepSource discards it —
      # "the merge commit doesn't exist upstream". Measured on this lane's
      # first real run, which reported against d61b9449 and landed nowhere.
      - name: Report coverage to DeepSource
        env:
          CLI_VERSION: '2.0.55'
          CLI_SHA256: '3d8264fef2487b39a7b9efd801d06bce8d04fe1ed8d5b5f13a876cd31e5a680d'
        run: |
          set -euo pipefail
          archive="deepsource_${CLI_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://cli.deepsource.com/build/$archive"
          echo "${CLI_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" deepsource
          # Run from the repository root: the CLI resolves the lcov's file
          # paths against the working directory.
          "$RUNNER_TEMP/deepsource" report --analyzer test-coverage \
            --key javascript --value-file tmp/coverage/lcov.info --use-oidc \
            --commit "${{ github.event.pull_request.head.sha || github.sha }}"
