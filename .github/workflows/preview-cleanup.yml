# Releases a PR's preview-web deployment records when the PR closes (merged or
# not), so the Environments UI doesn't accumulate stale "Active" previews.
# Matches records by their environment_url (the branch-alias URL that
# preview-pr-deploy.yml attaches), marks them inactive, then deletes them.
#
# Deliberately has NO environment binding and NO Cloudflare secrets: it only
# touches GitHub deployment records via the workflow token, so the cleanup run
# itself never mints a new deployment record. The Cloudflare-side preview
# deployments are inert static files that the next push to the same branch
# alias overwrites; they are left to Cloudflare's own retention.
name: Preview Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  deployments: write

concurrency:
  group: preview-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  release-deployment:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Deactivate and delete this PR's preview deployment records
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Untrusted branch name: read via env and sanitized to [a-z0-9-] with
          # the same rules the deploy path uses, so the alias hostnames match.
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          label=$(printf '%s' "$HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-28)
          [ -z "$label" ] && label="pr-$PR_NUMBER"
          alias_prefix="https://$label.kamiazya-whiteboard.pages.dev"
          echo "releasing preview deployments with environment_url under: $alias_prefix"

          # The listing below is a snapshot. When several PRs merge at once
          # their cleanup runs iterate overlapping snapshots, so a deployment
          # can disappear between the listing and the calls that act on it.
          # A 404 therefore means another run already reached the end state we
          # want, and must not fail this job. Any other error still does.
          err_file=$(mktemp)
          trap 'rm -f "$err_file"' EXIT
          api_or_gone() {
            local out
            # stderr goes to a file rather than being folded into stdout, so a
            # warning from gh can never end up parsed as a deployment URL.
            if out=$(gh api "$@" 2>"$err_file"); then
              printf '%s' "$out"
              return 0
            fi
            if grep -q 'HTTP 404' "$err_file"; then
              return 2
            fi
            cat "$err_file" >&2
            return 1
          }

          # --paginate: the environment accumulates records faster than PRs
          # close (deploy-preview.yml mints one per push to main), so a single
          # 100-record page can miss this PR's records entirely.
          ids=$(gh api --paginate "repos/$REPO/deployments?environment=preview-web&per_page=100" --jq '.[].id')
          released=0
          skipped=0
          for id in $ids; do
            url=$(api_or_gone "repos/$REPO/deployments/$id/statuses?per_page=1" \
              --jq '.[0].environment_url // empty') || {
              [ $? -eq 2 ] || exit 1
              skipped=$((skipped+1))
              continue
            }
            case "$url" in
              "$alias_prefix"|"$alias_prefix"/*)
                # Deployments must be inactive before they can be deleted.
                api_or_gone --method POST "repos/$REPO/deployments/$id/statuses" \
                  -f state=inactive >/dev/null || {
                  [ $? -eq 2 ] || exit 1
                  skipped=$((skipped+1))
                  continue
                }
                api_or_gone --method DELETE "repos/$REPO/deployments/$id" >/dev/null || {
                  [ $? -eq 2 ] || exit 1
                  skipped=$((skipped+1))
                  continue
                }
                released=$((released+1))
                echo "released deployment $id ($url)"
                ;;
            esac
          done
          echo "released $released deployment record(s); skipped $skipped already removed by a concurrent run"
