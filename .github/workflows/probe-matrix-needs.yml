# TEMPORARY PROBE — deleted in this same pull request once it has answered.
#
# Question it settles: does `needs.<job>.result` on a MATRIX job report ONE
# aggregated result for the whole matrix, and is that result `failure` when a
# single leg fails? An aggregate CI gate is built on that answer, and the
# GitHub docs pages for the needs context, the workflow syntax and the matrix
# how-to each stop short of stating it.
#
# workflow_dispatch only, so it never runs on a pull request and cannot affect
# any PR's checks.
name: probe-matrix-needs

on:
  workflow_dispatch:

jobs:
  legs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leg: [1, 2]
    steps:
      - name: Leg ${{ matrix.leg }} — leg 2 fails on purpose
        run: exit ${{ matrix.leg == 2 && 1 || 0 }}

  answer:
    if: always()
    needs: [legs]
    runs-on: ubuntu-latest
    steps:
      - name: Report the aggregated result
        run: |
          echo "PROBE needs.legs.result = ${{ needs.legs.result }}"
          echo "PROBE toJSON(needs) = ${{ toJSON(needs) }}"
