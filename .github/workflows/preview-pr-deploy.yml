# PR preview — DEPLOY half (trusted). Triggered by a completed "Preview PR Build"
# run. Because workflow_run always uses the workflow definition from the default
# branch and this job never checks out or runs PR code, the Cloudflare secrets are
# only ever exposed to trusted repo-owned steps. It downloads the artifact the
# build produced and publishes those pre-built static files — the untrusted PR
# code that produced them never touched a secret. Where it publishes (the branch
# label) and which PR it comments on come from the workflow_run event, never from
# anything the build uploaded.
#
# wrangler comes from the DEFAULT branch's deploy tooling lockfile
# (.github/deploy, the same one deploy-preview.yml and release.yml deploy with),
# installed with lifecycle scripts off, so no dependency code runs in this job
# before wrangler does; the Cloudflare secrets are bound to the deploy step alone.
name: Preview PR Deploy

on:
  workflow_run:
    workflows: ["Preview PR Build"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: preview-pr-deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    environment:
      name: preview-web
      # Attaches this PR's branch-alias preview URL to the deployment record so
      # the Environments UI reflects reality; preview-cleanup.yml releases the
      # record when the PR closes. (environment.url is resolved at job end, so
      # it may reference the deploy step's output.)
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
    steps:
      # The default branch, never the PR, and only the deploy tooling: this
      # checkout supplies the lockfile wrangler is installed from. It runs
      # first because checkout cleans the workspace.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/deploy
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the pinned wrangler (lockfile, no lifecycle scripts)
        id: tooling
        working-directory: .github/deploy
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          echo "wrangler=$(jq -r '.packages["node_modules/wrangler"].version' package-lock.json)" >> "$GITHUB_OUTPUT"
      - name: Download the built site from the triggering run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview-pr-dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: artifacts/preview-pr-dist
      - name: Derive the PR number and preview label from the triggering event
        id: meta
        # The build half runs the PR's own copy of its workflow, so nothing it
        # uploads may decide where this deploys or which issue gets the comment:
        # both come from the workflow_run event GitHub wrote.
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          PR_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          # The branch name is still chosen by the PR author. The Pages project's
          # production branch is `main` and `latest` is main's preview alias, so a
          # label sanitizing to either (`Main`, `main_`, `-main`) would publish PR
          # code there; such a label, or an empty one, becomes `pr-<n>`.
          # preview-cleanup.yml and preview-retention.yml carry this same function
          # to find what was deployed (preview-pr-deploy-label.test.ts holds them equal).
          preview_label() {
            local label
            label=$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-28)
            case "$label" in
              ''|main|latest|stable) label="pr-$2" ;;
            esac
            printf '%s' "$label"
          }
          case "$PR_NUMBER" in
            ''|*[!0-9]*) echo "no pull request attached to this run; refusing to deploy" >&2; exit 1 ;;
          esac
          if [ "$PR_HEAD_SHA" != "$RUN_HEAD_SHA" ]; then
            # A newer push superseded this build; its own run deploys. Skip
            # rather than fail, so a superseded run does not read as red.
            echo "::notice::PR #$PR_NUMBER head ($PR_HEAD_SHA) is not the built commit ($RUN_HEAD_SHA); skipping this superseded build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "branch=$(preview_label "$HEAD_BRANCH" "$PR_NUMBER")" >> "$GITHUB_OUTPUT"
      - name: Refuse anything but static files
        id: guard
        if: steps.meta.outputs.skip != 'true'
        # Pages runs an artifact's `_worker.js` (a file or a directory) as
        # server code on the preview hostname, and `_routes.json` decides
        # which requests reach it; a PR build may publish neither.
        env:
          BRANCH: ${{ steps.meta.outputs.branch }}
          HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          set -euo pipefail
          # BRANCH is pre-sanitized to [a-z0-9-]; a reserved alias here would
          # be a production deploy of PR code.
          case "$BRANCH" in
            ''|main|latest|stable) echo "refusing to deploy to reserved branch '$BRANCH'" >&2; exit 1 ;;
          esac
          dist=artifacts/preview-pr-dist
          [ -d "$dist" ] || { echo "no built site at $dist" >&2; exit 1; }
          for name in _worker.js _routes.json; do
            if [ -e "$dist/$name" ] || [ -L "$dist/$name" ]; then
              echo "refusing to deploy: the artifact carries $name, which Pages would run as server code" >&2
              exit 1
            fi
          done
          echo "ready=$HAS_CLOUDFLARE" >> "$GITHUB_OUTPUT"
      - name: Deploy the built artifact (no PR code executes here)
        id: deploy
        if: steps.meta.outputs.skip != 'true' && steps.guard.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The wrangler installed above; the exact version keeps the action
          # from running an install of its own.
          workingDirectory: .github/deploy
          packageManager: npm
          wranglerVersion: ${{ steps.tooling.outputs.wrangler }}
          command: pages deploy ../../artifacts/preview-pr-dist --project-name=kamiazya-whiteboard --branch=${{ steps.meta.outputs.branch }}
      - name: Comment preview URL on the PR
        if: steps.deploy.outputs.pages-deployment-alias-url != '' || steps.deploy.outputs.deployment-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
          PR: ${{ steps.meta.outputs.pr }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          MARKER='<!-- cf-pages-preview -->'
          BODY=$(printf '%s\n🔎 **Cloudflare Pages preview**: %s\n\nBuilt from this PR without exposing deploy secrets to PR code. Browser mode works on preview URLs; daemon mode is origin-locked to production.' "$MARKER" "$URL")
          CID=$(gh api "repos/$REPO/issues/$PR/comments" --jq "[.[] | select(.body | contains(\"$MARKER\"))][0].id // empty")
          if [ -n "$CID" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$CID" -f body="$BODY" >/dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$BODY" >/dev/null
          fi
