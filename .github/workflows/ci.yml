name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@26f6d4f2c533a43e6b5da0b4a5dd983f98f7b49a # v6.0.4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Validate PR title
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm check:pr-title -- "${{ github.event.pull_request.title }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @kamiazya/whiteboard-mcp exec playwright install --with-deps chromium

      - name: Audit (high+ vulnerabilities, prod deps only)
        # Gate on CVEs that affect published artifacts so they are caught at PR time.
        run: pnpm audit --prod --audit-level=high

      - name: Validate skills
        run: pnpm intent:validate

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Stdio E2E smoke
        env:
          WHITEBOARD_DEV: '1'
        run: pnpm smoke:e2e

      - name: Template smoke
        run: pnpm smoke:template

      - name: Build
        run: pnpm build

      - name: Packaged stdio smoke
        run: pnpm smoke:packaged

      - name: Packed tarball smoke
        run: pnpm smoke:tarball

      - name: Codex config smoke
        run: pnpm smoke:codex-config
