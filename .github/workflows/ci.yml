name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Safety net: this job has historically hung indefinitely on the Playwright
    # browser download (no per-step bound), wasting a 6h runner slot. Cap it.
    # 60 covers the cold-cache worst case (bounded Playwright retries + the full
    # test/smoke/build suite); a warm cache makes the Playwright step ~1 min.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Validate PR title
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm check:pr-title -- "${{ github.event.pull_request.title }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cache Playwright's Chromium binary keyed by the lockfile so the browser
      # is only re-downloaded when the Playwright version changes. OS-level deps
      # (libglib2, libnss3, etc.) are not stored in ~/.cache/ms-playwright and
      # must be installed on every run via install-deps regardless of cache state.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browser (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: pnpm --filter @kamiazya/whiteboard-mcp exec playwright install chromium

      - name: Install Playwright system deps
        timeout-minutes: 10
        run: pnpm --filter @kamiazya/whiteboard-mcp exec playwright install-deps chromium

      - name: Audit (high+ vulnerabilities, prod deps only)
        # Gate on CVEs that affect published artifacts so they are caught at PR time.
        run: pnpm audit --prod --audit-level=high

      - name: Validate skills
        run: pnpm intent:validate

      - name: Secret scan (secretlint)
        run: pnpm secretlint

      # Staged biome adoption: enforce the AGENTS.md "no console.* in server
      # runtime" rule in CI. Full biome check is not wired yet (the repo still
      # carries pre-existing format/organizeImports violations); this gate stops
      # new server-runtime console.* from landing without requiring that cleanup.
      - name: Lint (server noConsole gate)
        run: pnpm lint:noconsole

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Stdio E2E smoke
        env:
          WHITEBOARD_DEV: '1'
        run: pnpm smoke:e2e

      - name: Template smoke
        run: pnpm smoke:template

      - name: Build
        run: pnpm build

      - name: Web app artifact smoke
        run: pnpm --filter @kamiazya/whiteboard-web smoke:artifact

      - name: Web app preview-origin behavioral smoke
        run: pnpm --filter @kamiazya/whiteboard-web smoke:preview-origin

      - name: Packaged stdio smoke
        run: pnpm smoke:packaged

      - name: Packed tarball smoke
        run: pnpm smoke:tarball

      - name: Codex config smoke
        run: pnpm smoke:codex-config

      - name: Check release artifacts
        run: pnpm --filter @kamiazya/whiteboard-mcp check:release-artifacts

  dry-run-npm:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: npm publish dry-run
        run: pnpm publish:dry-run:npm

      - name: Upload npm dry-run artifacts
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee7ef5a6fab9f92b81 # v4
        with:
          name: npm-tarball-dry-run-${{ github.run_id }}
          path: packages/mcp-server/tmp/publish-dry-run/
          if-no-files-found: error

  dry-run-docker:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Docker build dry-run
        run: pnpm publish:dry-run:docker

      - name: Upload docker dry-run metadata
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee7ef5a6fab9f92b81 # v4
        with:
          name: docker-image-dry-run-${{ github.run_id }}
          path: packages/mcp-server/tmp/publish-dry-run/docker-image-metadata.json
          if-no-files-found: warn
