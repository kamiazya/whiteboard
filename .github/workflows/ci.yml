name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Safety net: this job has historically hung indefinitely on the Playwright
    # browser download (no per-step bound), wasting a 6h runner slot. Cap it.
    # 60 covers the cold-cache worst case (bounded Playwright retries + the full
    # test/smoke/build suite); a warm cache makes the Playwright step ~1 min.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Validate PR title
        if: ${{ github.event_name == 'pull_request' }}
        run: pnpm check:pr-title -- "${{ github.event.pull_request.title }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Install Playwright's Chromium into a DEDICATED, cache-owned directory
      # (PLAYWRIGHT_BROWSERS_PATH) instead of the default ~/.cache/ms-playwright.
      # The GitHub runner pre-seeds the default path with its own browser build;
      # installing over it triggers a "Removing unused browser" + re-download that
      # then hangs after the download completes (observed: download reaches 100%,
      # then ~6 min of silence until the timeout). A clean dedicated path avoids
      # that conflict and is what we cache against the Playwright version so warm
      # runs skip the download entirely. PLAYWRIGHT_BROWSERS_PATH is written to
      # $GITHUB_ENV so the later test/smoke steps resolve the same browser.
      # See https://playwright.dev/docs/ci#caching-browsers
      - name: Set Playwright browsers path
        run: echo "PLAYWRIGHT_BROWSERS_PATH=${HOME}/.pw-browsers" >> "$GITHUB_ENV"

      - name: Resolve Playwright version
        id: pw
        run: |
          echo "version=$(pnpm --filter @kamiazya/whiteboard-mcp exec playwright --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}-

      - name: Install Playwright Chromium
        # Both workspaces pin the same Playwright version, so one install covers
        # every browser-mode test project — no need to run apt+download twice.
        # On a cache hit only the (uncacheable) OS deps are installed; on a miss
        # the browser is downloaded too. The download can stall on the CDN, so
        # bound each attempt with `timeout` and retry — a transient stall recovers
        # instead of hanging the job until the runner limit.
        timeout-minutes: 25
        env:
          PW_CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          set -eu
          if [ "${PW_CACHE_HIT}" = "true" ]; then
            args="install-deps chromium"
          else
            args="install --with-deps chromium"
          fi
          for attempt in 1 2 3 4; do
            if timeout 420 pnpm --filter @kamiazya/whiteboard-mcp exec playwright ${args}; then
              exit 0
            fi
            echo "::warning::Playwright setup attempt ${attempt} stalled or failed; retrying" >&2
            sleep 15
          done
          echo "::error::Playwright setup failed after 4 attempts" >&2
          exit 1

      - name: Audit (high+ vulnerabilities, prod deps only)
        # Gate on CVEs that affect published artifacts so they are caught at PR time.
        run: pnpm audit --prod --audit-level=high

      - name: Validate skills
        run: pnpm intent:validate

      # Staged biome adoption: enforce the AGENTS.md "no console.* in server
      # runtime" rule in CI. Full biome check is not wired yet (the repo still
      # carries pre-existing format/organizeImports violations); this gate stops
      # new server-runtime console.* from landing without requiring that cleanup.
      - name: Lint (server noConsole gate)
        run: pnpm lint:noconsole

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Stdio E2E smoke
        env:
          WHITEBOARD_DEV: '1'
        run: pnpm smoke:e2e

      - name: Template smoke
        run: pnpm smoke:template

      - name: Build
        run: pnpm build

      - name: Web app artifact smoke
        run: pnpm --filter @kamiazya/whiteboard-web smoke:artifact

      - name: Web app preview-origin behavioral smoke
        run: pnpm --filter @kamiazya/whiteboard-web smoke:preview-origin

      - name: Packaged stdio smoke
        run: pnpm smoke:packaged

      - name: Packed tarball smoke
        run: pnpm smoke:tarball

      - name: Codex config smoke
        run: pnpm smoke:codex-config

      - name: Check release artifacts
        run: pnpm --filter @kamiazya/whiteboard-mcp check:release-artifacts

  dry-run-npm:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: npm publish dry-run
        run: pnpm publish:dry-run:npm

      - name: Upload npm dry-run artifacts
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee7ef5a6fab9f92b81 # v4
        with:
          name: npm-tarball-dry-run-${{ github.run_id }}
          path: packages/mcp-server/tmp/publish-dry-run/
          if-no-files-found: error

  dry-run-docker:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Docker build dry-run
        run: pnpm publish:dry-run:docker

      - name: Upload docker dry-run metadata
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee7ef5a6fab9f92b81 # v4
        with:
          name: docker-image-dry-run-${{ github.run_id }}
          path: packages/mcp-server/tmp/publish-dry-run/docker-image-metadata.json
          if-no-files-found: warn
