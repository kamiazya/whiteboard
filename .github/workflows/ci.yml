name: ci

on:
  pull_request:
  # For the merge queue: its speculative merge commits fire `merge_group`,
  # and a required check that never reports on that event stalls the whole
  # queue until timeout. Harmless while no queue is configured — the event
  # simply never fires.
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Nothing in this job talks to the remote after checkout, so the token
      # is not left in .git/config for the install and the tests to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      # PR-title validation lives in pr-title.yml: it must re-run when the
      # title is EDITED, and adding `edited` here would re-run this whole
      # workflow (build + every test suite) on every PR body edit instead.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit (high+ vulnerabilities, prod deps only)
        # Gate on CVEs that affect published artifacts so they are caught at PR
        # time. Behind audit-with-retry.mjs because the advisories endpoint's
        # outages otherwise fail this job with a stack trace and no finding —
        # the wrapper retries ONLY registry-shaped failures and fails a real
        # finding immediately. A `pnpm ` run line on purpose:
        # local-gate-command.test.ts derives `check:local` from those.
        run: pnpm audit:prod

      - name: Secret scan (secretlint)
        run: pnpm secretlint

      # compose-figure.mjs shells out to ImageMagick, which the runner image no
      # longer ships. Installed rather than skipped-when-absent: a guard that
      # quietly does not run in CI is the exact failure the script it covers
      # exists to prevent.
      - name: Install ImageMagick (compose-figure tests)
        # The runner image ships third-party apt sources, and any one of them
        # failing fails the whole `apt-get update` and this job with it, for
        # repositories nothing here installs from: packages.microsoft.com
        # intermittently answers 403, and dl.google.com's Chrome index has
        # answered a Hash Sum mismatch for the better part of an hour while
        # its mirrors caught up with a regenerated release file. Keeping only
        # Ubuntu's own archive (`ubuntu.sources`, a deb822 file on noble)
        # scopes the update to where imagemagick actually comes from, so the
        # next vendor source the image adds cannot fail it either.
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f ! -name ubuntu.sources -delete
          sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick

      # cleanup-worktrees.mjs can force-remove worktrees and delete local
      # branches; keep its regression test enforced in the same gate as the
      # other repo-hygiene tooling checks.
      - name: Test dev scripts (node --test)
        run: pnpm test:scripts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  test-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # One shard failing must not cancel its siblings: a cancelled job is not
      # a failed one, so "Re-run failed jobs" never revives it and the run can
      # never reach green again. See ci-policy.test.ts for the measurement.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      # Two commits, so the merge commit's first parent (the base tip) is
      # there to diff against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # This job's share of the change scope, computed here rather than read
      # from the `scope` job: see that job's comment for why there is no hop.
      - name: Detect change scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: node tools/checks/src/affected-cli.mjs job test-unit --event "$EVENT"

      - name: Not affected by this change
        if: steps.scope.outputs.run != 'true'
        env:
          REASON: ${{ steps.scope.outputs.reason }}
        # An annotation, so the skip and its reason show on the run summary.
        run: echo "::notice title=Not affected by this change::$REASON"

      - uses: ./.github/actions/setup-pnpm
        if: steps.scope.outputs.run == 'true'

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      # The daemon lays canvases out through the Rust core in differential
      # (ADR-0054 stage 2: both run, the TypeScript answers), and a
      # difference fails the test that drew it. The artifact comes from the
      # cache keyed on its inputs, so a hit needs no Rust toolchain.
      - uses: ./.github/actions/core-wasm
        if: contains(fromJSON(steps.scope.outputs.projects), 'mcp-node')

      # Shard mcp-node (largest suite) across 2 parallel runners.
      # --shard splits the collected spec list so each runner handles a disjoint half.
      - name: Test mcp-node (shard ${{ matrix.shard }}/2)
        if: contains(fromJSON(steps.scope.outputs.projects), 'mcp-node')
        env:
          WHITEBOARD_CORE: differential
          WHITEBOARD_CORE_MISMATCH: throw
        run: pnpm exec vitest run --project=mcp-node --shard=${{ matrix.shard }}/2

      # canvas-viewer is small enough to skip sharding; run it once (shard 1)
      # so it isn't duplicated across the matrix. Shard 2 carries only its
      # half of mcp-node: the shared-layer step it used to run afterwards is
      # the `test-shared` job below, since serial behind this shard it was
      # the run's critical path.
      - name: Test canvas-viewer-node
        if: matrix.shard == 1 && contains(fromJSON(steps.scope.outputs.projects), 'canvas-viewer-node')
        run: pnpm exec vitest run --project=canvas-viewer-node

      - name: Test canvas-viewer-jsdom
        if: matrix.shard == 1 && contains(fromJSON(steps.scope.outputs.projects), 'canvas-viewer-jsdom')
        run: pnpm exec vitest run --project=canvas-viewer-jsdom

  # The shared-layer package suites and arch-lint. This is also what fails CI
  # when a generated artifact (e.g. docs/reference/x-whiteboard.schema.json)
  # drifts from its source schema: file-snapshot tests only reject in CI-mode
  # runs like this one.
  #
  # Its own job rather than a step on test-unit's shard 2, where it lived
  # first. Measured on one run (2026-09-16): the whole graph settled in 5m01s
  # and this step was the last 2m14s of it, serial behind mcp-node's shard 2
  # (1m44s), with every other job finished a minute or more earlier. Moving it
  # out costs one more checkout+install (~35-45s) on its own runner and takes
  # ~1m15s off the wall clock, which then belongs to test-browser. It is not
  # in the branch-protection required list (see verify's comment): `ci-gate`
  # is what gates it.
  #
  # The project list is DERIVED (tools/checks/src/vitest-projects.mjs), not
  # hand-listed: every non-browser vitest project in root vitest.config.ts
  # that isn't covered by another CI step (PROJECTS_RUN_ELSEWHERE in that
  # file) runs here automatically, so a new shared-layer package is covered
  # by CI the moment it registers a project, with no edit to this file.
  #
  # Sharded 2-way like its siblings: unsharded it was the longest job in 8 of
  # 10 green main runs (267-417s) and the last to finish in half of them,
  # 27-58s behind the then-separate npm dry-run job. The script forwards its argv to vitest, which
  # splits the derived projects' files across the legs.
  test-shared:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      # Same reason as test-unit: a cancelled leg is never revived by
      # "Re-run failed jobs".
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      # Two commits, so the merge commit's first parent (the base tip) is
      # there to diff against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # This job's share of the change scope, computed here rather than read
      # from the `scope` job: see that job's comment for why there is no hop.
      - name: Detect change scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: node tools/checks/src/affected-cli.mjs job test-shared --event "$EVENT"

      - name: Not affected by this change
        if: steps.scope.outputs.run != 'true'
        env:
          REASON: ${{ steps.scope.outputs.reason }}
        # An annotation, so the skip and its reason show on the run summary.
        run: echo "::notice title=Not affected by this change::$REASON"

      - uses: ./.github/actions/setup-pnpm
        if: steps.scope.outputs.run == 'true'

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      # Only the projects the change reaches, out of this job's derived
      # universe; affected-cli.mjs refuses a name outside it and an empty
      # list, which cannot get here because `run` is then false.
      - name: Test shared-layer packages + arch-lint (shard ${{ matrix.shard }}/2)
        if: steps.scope.outputs.run == 'true'
        env:
          AFFECTED_PROJECTS: ${{ steps.scope.outputs.projects }}
        run: node tools/checks/src/affected-cli.mjs run test-shared --shard=${{ matrix.shard }}/2

  test-jsdom:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Sharded for the same reason test-unit and test-browser are, and only once
    # dry-run-docker stopped being the ceiling: on the ~half of pull requests
    # that skip the image build, this job IS the wall. Measured locally, whole
    # command (jsdom + web-node): 372 files / 3907 tests / 279s unsharded;
    # 186 files / 2056 tests / 117s at shard 1/2 and 186 / 1851 / 162s at 2/2.
    # The shards partition exactly — 186+186 and 2056+1851 — so nothing is
    # lost or run twice, and the wall clock goes 279s -> 162s. Uneven because
    # vitest shards by file, not by cost.
    #
    # The command stays `pnpm --filter @kamiazya/whiteboard-web test`, which
    # runs BOTH the jsdom project and web-node's build/deploy guards, and
    # forwards --shard to each (apps/web/scripts/run-web-tests.mjs). Two
    # hand-written vitest invocations here would have been simpler and would
    # have retired the `whiteboard-web test` marker that ci-verify-coverage
    # and vitest-projects.mjs both key on.
    strategy:
      # One shard failing must not cancel its siblings: a cancelled job is not
      # a failed one, so "Re-run failed jobs" never revives it and the run can
      # never reach green again. See ci-policy.test.ts for the measurement.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      # Two commits, so the merge commit's first parent (the base tip) is
      # there to diff against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # This job's share of the change scope, computed here rather than read
      # from the `scope` job: see that job's comment for why there is no hop.
      - name: Detect change scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: node tools/checks/src/affected-cli.mjs job test-jsdom --event "$EVENT"

      - name: Not affected by this change
        if: steps.scope.outputs.run != 'true'
        env:
          REASON: ${{ steps.scope.outputs.reason }}
        # An annotation, so the skip and its reason show on the run summary.
        run: echo "::notice title=Not affected by this change::$REASON"

      - uses: ./.github/actions/setup-pnpm
        if: steps.scope.outputs.run == 'true'

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Test web (jsdom + node, shard ${{ matrix.shard }}/2)
        if: steps.scope.outputs.run == 'true'
        run: pnpm --filter @kamiazya/whiteboard-web test -- --shard=${{ matrix.shard }}/2

  test-browser:
    runs-on: ubuntu-24.04
    # Run on bare ubuntu-24.04 with the pre-installed system Chrome.
    timeout-minutes: 15
    # Sharded like test-unit: the browser job is the longest in the workflow
    # (5.0min measured on a green main) AND its flake family is contention-
    # shaped — parallel pages in one browser fighting over focus and origin
    # state — so halving the files per runner attacks both at once. Verified
    # locally that the shards partition exactly: 69+69 of 138 files,
    # 410+342 of 752 tests, no overlap and no loss. Three shards since a
    # shard that died with VITEST_BROWSER_CONNECTION_CLOSED had 5.4 GB free
    # and no OOM kill while Chrome's summed RSS climbed 8.3 -> 11.6 GB across
    # it: growth that accumulates per shard, so a third fewer files each.
    strategy:
      # One shard failing must not cancel its siblings: a cancelled job is not
      # a failed one, so "Re-run failed jobs" never revives it and the run can
      # never reach green again. See ci-policy.test.ts for the measurement.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      WHITEBOARD_CHROME_PATH: /usr/bin/google-chrome-stable
    steps:
      # Two commits, so the merge commit's first parent (the base tip) is
      # there to diff against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # This job's share of the change scope, computed here rather than read
      # from the `scope` job: see that job's comment for why there is no hop.
      - name: Detect change scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: node tools/checks/src/affected-cli.mjs job test-browser --event "$EVENT"

      - name: Not affected by this change
        if: steps.scope.outputs.run != 'true'
        env:
          REASON: ${{ steps.scope.outputs.reason }}
        # An annotation, so the skip and its reason show on the run summary.
        run: echo "::notice title=Not affected by this change::$REASON"

      - uses: ./.github/actions/setup-pnpm
        if: steps.scope.outputs.run == 'true'

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      # The web app routes edges through the Rust core in differential
      # (ADR-0054 stage 2): its layout worker and its page fetch the wasm,
      # and a difference throws in the test that drew it. Same cache as
      # test-unit's, so a hit needs no Rust toolchain.
      - uses: ./.github/actions/core-wasm
        if: steps.scope.outputs.run == 'true'

      # The browser projects the change reaches, out of a universe DERIVED
      # from each config's browser mode — the set the root test:browser
      # script lists (ci-verify-coverage.test.ts holds the two equal), so a
      # new browser-mode project is covered the moment it is registered.
      # A shard has died part-way with VITEST_BROWSER_CONNECTION_CLOSED, a
      # different file each time and never locally, where the same shard
      # holds Chrome flat at 2-3 GB. Memory is sampled for the length of the
      # run so a death says whether the runner was out of it; the step after
      # the tests prints the samples and the kernel's OOM lines on failure.
      - name: Sample memory during the browser run
        if: steps.scope.outputs.run == 'true'
        run: |
          sample() {
            while true; do
              used=$(free -m | awk '/Mem:/ {print $3 "/" $2 " MB used, " $7 " MB available"}')
              chrome=$(ps -eo rss=,comm= | awk '/chrom/ {s += $1; if ($1 > m) m = $1} END {print int(s / 1024) " MB in chrome, the largest process " int(m / 1024) " MB"}')
              echo "$(date -u +%T) $used, $chrome"
              sleep 10
            done
          }
          sample > "$RUNNER_TEMP/memory.log" 2>&1 &

      - name: Test browser projects (shard ${{ matrix.shard }}/3)
        if: steps.scope.outputs.run == 'true'
        timeout-minutes: 12
        env:
          AFFECTED_PROJECTS: ${{ steps.scope.outputs.projects }}
          VITE_WHITEBOARD_CORE: differential
          VITE_WHITEBOARD_CORE_MISMATCH: throw
        run: node tools/checks/src/affected-cli.mjs run test-browser --shard=${{ matrix.shard }}/3

      # A failing browser test prints the path of its retained trace and the
      # runner is then discarded with it; the trace is the only place its
      # stack, action log and screenshots are kept (vitest.browser.shared.ts).
      # About 80KB per failure, since DOM snapshots are off. A failed
      # `toMatchScreenshot` writes its candidate PNG under the repo-root
      # `.vitest/attachments/` instead, and that file is how a contributor
      # off linux gets a linux pixel baseline (pixel-golden-scenes.ts); the
      # directory is hidden, so it needs `include-hidden-files`. Held by
      # ci-policy.test.ts for every job that runs a browser project.
      - name: Memory and kernel log of a failed browser run
        if: failure() && steps.scope.outputs.run == 'true'
        run: |
          echo "--- memory, every 10s ---"
          cat "$RUNNER_TEMP/memory.log" || true
          echo "--- kernel: out-of-memory and killed processes ---"
          sudo dmesg -T | grep -iE 'out of memory|oom|killed process' | tail -20 || true

      - name: Upload browser traces of failed tests
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-traces-test-browser-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            **/tmp/vitest-traces/**/*.trace.zip
            .vitest/attachments/**/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  # Detection-at-introduction (industry pattern: run new/changed tests many
  # times BEFORE they can flake on main): every test file this PR touches is
  # re-run 5x in fresh processes. A test that cannot survive five quiet runs
  # has no business gating anyone; catching it here costs one job, catching
  # it on main costs a root-cause lane (.claude/skills/steward/reference/flake-shapes.md).
  stress-changed-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # SPLIT so a browser file never shares a vitest process with a node or
    # jsdom one. Everywhere else in CI they are separate jobs — `test-browser`
    # x2, `test-jsdom` x2, `test-unit` x2 — and this lane was the only place
    # that put all three realms in ONE process, at whatever size the diff
    # happened to be. That is not a scale the repo's tests are written
    # against, and it showed: on a 290-file changed set (a repo-wide fixture
    # migration) four consecutive runs each failed a DIFFERENT test, none of
    # which the same commit's `test-unit`/`test-browser`/`test-jsdom` jobs
    # could fail, and none of which reproduced locally. Two were budgets
    # sized for a normal run (a wall-clock stall ceiling, a 5s default) and
    # were fixed on their merits; the third was a browser test losing typed
    # characters to ~115 chromium contexts competing with 175 node workers.
    #
    # The lane's job is to stress the tests a PR TOUCHED. At this size it was
    # instead amplifying the whole suite's residual flakiness: five fresh runs
    # plus `--repeats=3` is six full-suite passes, so even a small per-run
    # failure probability makes red near-certain — and what it reported then
    # said nothing about the diff.
    #
    # The partition is by project NAME, not by a list of them: a list beside
    # the vitest config is the drift this repo keeps paying for. vitest takes
    # globs and negation (`--project '*-browser*'` / `--project '!*-browser*'`),
    # so the two legs are complementary by construction. What that RESTS on —
    # every browser-mode project's name containing `-browser` (as a suffix,
    # `web-browser`, or inside it, `web-browser-window-state`), no other
    # project's name containing it, and every project being claimed by exactly
    # one leg — is derived from each config's browser mode and asserted in
    # `ci-stress-job.test.ts`, because `--passWithNoTests` makes a pattern
    # that matches nothing silent.
    #
    # 60 minutes: before the split, five runs at 369-380s each plus the
    # repeats step came to ~40 on the full set, and the 30 it had ran out
    # partway through the fifth — reporting `cancelled`, which is neither a
    # pass nor a failure and which `ci-gate` correctly refuses. Each leg is
    # smaller than that now and they run in parallel; the headroom stays
    # because the cost is WORKER time (92-93% of each run, one process per
    # file) and it grows with the diff.
    #
    # The node leg is sharded the way `test-browser` is, with vitest's own
    # `--shard=i/n`: it splits the files that survive the project filter, so
    # no list of changed files is partitioned by hand and a browser file can
    # never skew a node shard. Unsharded, that leg was the pull request's wall
    # clock on most runs that touched tests — 125 changed files cost ~500s for
    # the five fresh runs plus ~200s for the repeats on one runner, 150-560s
    # past every other job. A shard that draws no file passes under
    # `--passWithNoTests`; `ci-gate` judges each shard by its own conclusion.
    # The browser leg stays one shard: its pattern is the small half.
    timeout-minutes: 60
    strategy:
      # One leg failing must not hide the other's result.
      fail-fast: false
      matrix:
        include:
          - leg: browser
            projects: '*-browser*'
            shard: 1
            shards: 1
          - leg: node
            projects: '!*-browser*'
            shard: 1
            shards: 3
          - leg: node
            projects: '!*-browser*'
            shard: 2
            shards: 3
          - leg: node
            projects: '!*-browser*'
            shard: 3
            shards: 3
    env:
      WHITEBOARD_CHROME_PATH: /usr/bin/google-chrome-stable
    steps:
      # The changed-file diff is local (HEAD^1 of the merge ref), so the
      # token need not stay in .git/config for the PR's tests to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect changed test files
        id: changed
        # `.claude/**` is excluded: its test-NAMED files (biome-plugin lint
        # fixtures) belong to no vitest project, and vitest exits 1 on a file
        # list that matches no project. `*.rust.test.ts` is excluded too: it
        # needs the wasm artifact only the rust job builds, and that job runs
        # it on every change in its path scope.
        #
        # HEAD^1 rather than a merge base against a fetched `origin/$BASE_REF`.
        # On a pull_request event the checked-out ref is the merge commit, so
        # its first parent IS the base tip and the diff needs no fetch at all.
        # The previous form fetched the base with `--depth=1`, which leaves it
        # with no reachable ancestry, and git then answered
        # `fatal: origin/main...HEAD: no merge base` — on stderr, at the head
        # of a pipeline, under a shell with `-e` but no `pipefail`. So the
        # step exited 0 with an empty file list, both stress steps skipped on
        # their `!= ''` guard, and the job reported SUCCESS in 43s having
        # stressed nothing. Measured on run 33971406910, where five changed
        # test files went unstressed.
        #
        # `pipefail` is the half that makes this loud rather than correct:
        # without it any future failure of that git command is a pass again.
        #
        # The existence filter is an `if`, not `[ -f ] && echo`. A while loop
        # exits with the status of its LAST iteration, so under `-e` the
        # short-circuited `&&` on a file the diff DELETED killed the whole
        # step — before anything ran. Order-dependent, which is why it hid:
        # measured, the same list passes when a surviving file happens to
        # come last and exits 1 when a deleted one does. Found on a PR that
        # retired sixteen test files.
        run: |
          set -o pipefail
          files=$(git diff --name-only HEAD^1 HEAD -- '*.test.ts' '*.test.tsx' '*.browser.test.ts' '*.browser.test.tsx' ':(exclude).claude/**' ':(exclude)**/*.rust.test.ts' | while read -r f; do if [ -f "$f" ]; then echo "$f"; fi; done | tr '\n' ' ')
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "changed test files: $files"

      # A node-realm test of the daemon's layout core asserts the staged wasm
      # is there wherever CI runs it, and the browser leg's web tests load it
      # in the page and the layout worker; the artifact comes from the same
      # cache test-unit restores, so a hit costs no Rust toolchain.
      - uses: ./.github/actions/core-wasm
        if: steps.changed.outputs.files != ''

      - name: Stress changed test files (5 runs, fresh process each)
        if: steps.changed.outputs.files != ''
        # Fresh vitest process per iteration on purpose: module state, test
        # order and process env all reset, which is closer to the conditions
        # a flake needs than one long in-process repeat.
        #
        # `--fsModuleCache` persists transformed modules on disk, so the four
        # reruns after the first do not re-transform the same graph. This job
        # is the one place in CI where that pays: every other job runs its
        # project once. Vitest's own performance hint named it here, with the
        # number — `transforming modules took 5.91s · 46% of tracked time,
        # re-done on every run`. Measured locally on this shape (four changed
        # web-jsdom files, five fresh processes, interleaved rounds): faster
        # in both paired rounds, 48.2s/47.0s plain against 39.7s/40.0s
        # cached, median 47.6s -> 39.8s. The cache lives under
        # node_modules/.vitest-cache and is not carried between CI runs, so
        # the first process of each job still pays full transform cost.
        #
        # The file list is PR-chosen names, so it arrives through env and is
        # split by `read -a`: interpolated, a name holding `$(…)` would run.
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          # Only the browser leg loads the web app's core: a jsdom page has no
          # fetch to load it with, and an empty value reads as unset.
          VITE_WHITEBOARD_CORE: ${{ matrix.leg == 'browser' && 'differential' || '' }}
          VITE_WHITEBOARD_CORE_MISMATCH: ${{ matrix.leg == 'browser' && 'throw' || '' }}
        run: |
          read -r -a files <<< "$CHANGED_FILES"
          for i in 1 2 3 4 5; do
            echo "=== stress run $i/5 (${{ matrix.leg }} ${{ matrix.shard }}/${{ matrix.shards }}) ==="
            pnpm exec vitest run --project '${{ matrix.projects }}' --shard=${{ matrix.shard }}/${{ matrix.shards }} --fsModuleCache --passWithNoTests "${files[@]}"
          done

      - name: Repeat changed tests in-process (3x)
        if: steps.changed.outputs.files != ''
        # The complementary class: state carried between repetitions of the
        # SAME test in one process (a leaked timer, a module-level cache, a
        # handle that was "most recent" last time). `--repeats` runs the
        # passes too, which is what separates it from `retry`.
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          # Only the browser leg loads the web app's core: a jsdom page has no
          # fetch to load it with, and an empty value reads as unset.
          VITE_WHITEBOARD_CORE: ${{ matrix.leg == 'browser' && 'differential' || '' }}
          VITE_WHITEBOARD_CORE_MISMATCH: ${{ matrix.leg == 'browser' && 'throw' || '' }}
        run: |
          read -r -a files <<< "$CHANGED_FILES"
          pnpm exec vitest run --project '${{ matrix.projects }}' --shard=${{ matrix.shard }}/${{ matrix.shards }} --repeats=3 --fsModuleCache --passWithNoTests "${files[@]}"

      # The browser leg's traces, for the reason `test-browser` uploads its
      # own: a stress failure is CI-only by construction, so the trace is all
      # there is to read.
      - name: Upload browser traces of failed tests
        if: failure() && matrix.leg == 'browser'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-traces-stress-changed-tests-attempt-${{ github.run_attempt }}
          path: |
            **/tmp/vitest-traces/**/*.trace.zip
            .vitest/attachments/**/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  sbom-npm:
    # Standing regression job: generate:sbom:npm only ran in release.yml before
    # this job existed, so an upstream cyclonedx-npm regression was invisible
    # until release time. Runs on every PR/push to catch it early.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate npm SBOM
        run: pnpm --filter @kamiazya/whiteboard-mcp generate:sbom:npm

      # No reinstall between the two steps, on purpose: the script's
      # `pnpm deploy --legacy --prod` marks the whole workspace prod-only, and
      # the script restores that record itself. If it ever stops, the next
      # top-level pnpm command below reinstalls without devDependencies or
      # aborts, so this job fails the way a developer's next command would.
      #
      # These tests run conditionally on the generated artifact and assert it
      # is non-empty and contains real production components (not silently
      # empty/partial from a swallowed or fatal npm ls error).
      - name: Verify generated SBOM content
        run: pnpm exec vitest run --project=mcp-node packages/mcp-server/src/server/release/sbom-policy.test.ts

  # Parallel to `verify`, own timeout budget: `test:e2e:distribution` already
  # exercises the same packaged node smokes pre-build, but that combined
  # release-candidate chain only runs on the release tag (see
  # publish-gate-runner.test.ts / release-gate-matrix.json). This job runs the
  # exact `publish`-tier smoke:distribution:packaged:node gate on every PR so it
  # cannot go stale between release tags without a PR-side failure. It names
  # the node half only: smoke:distribution:packaged adds the two CLI smokes,
  # which spend API quota wherever the CLI is installed.
  packaged-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/core-wasm

      - name: Build
        env:
          WHITEBOARD_SHIP_CORE_WASM: '1'
        run: pnpm build

      - name: Packaged distribution smoke
        env:
          WHITEBOARD_CORE: differential
          WHITEBOARD_CORE_MISMATCH: throw
        run: pnpm smoke:distribution:packaged:node

  # Prod vite build of packages/canvas-viewer's self-contained widget HTML,
  # verified against a real browser (not just the static grep): zero
  # network requests and the embedded font actually loaded, not silently
  # falling back to a system font.
  widget-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WHITEBOARD_CHROME_PATH: /usr/bin/google-chrome-stable
    steps:
      # Two commits, so the merge commit's first parent (the base tip) is
      # there to diff against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # This job's share of the change scope, computed here rather than read
      # from the `scope` job: see that job's comment for why there is no hop.
      - name: Detect change scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: node tools/checks/src/affected-cli.mjs job widget-smoke --event "$EVENT"

      - name: Not affected by this change
        if: steps.scope.outputs.run != 'true'
        env:
          REASON: ${{ steps.scope.outputs.reason }}
        # An annotation, so the skip and its reason show on the run summary.
        run: echo "::notice title=Not affected by this change::$REASON"

      - uses: ./.github/actions/setup-pnpm
        if: steps.scope.outputs.run == 'true'

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build canvas-viewer widget
        if: steps.scope.outputs.run == 'true'
        run: pnpm --filter @kamiazya/whiteboard-canvas-viewer build:widget

      - name: Widget smoke
        if: steps.scope.outputs.run == 'true'
        run: pnpm --filter @kamiazya/whiteboard-canvas-viewer smoke:widget

  verify:
    # No `needs` on the test jobs, deliberately — measured 2026-09-04, that
    # chain WAS the wall clock: pickup ~2min -> test-jsdom 5min -> verify
    # 3min -> dry-run-docker 5min ≈ 14min for a 5-minute-max job graph.
    # verify consumes nothing from the test jobs (fresh checkout + install),
    # and the "a release tag points at a commit where the tests ran"
    # property is carried by branch protection, which requires every test
    # job INDIVIDUALLY (check, test-unit 1+2, test-jsdom 1+2, test-browser
    # 1+2, widget-smoke — verified via the branch-protection API; the Actions
    # token cannot read it, so no test can pin this and the settings page is
    # the source of truth). SHARDING A REQUIRED JOB RENAMES ITS CHECK — a
    # matrix reports `test-jsdom (1)`, and a bare `test-jsdom` in the required
    # list then never reports at all, so every PR waits on a check that cannot
    # arrive. That is what `ci-gate` at the bottom of this file is for: it is
    # one stable check name over every job here, so a shard count becomes an
    # implementation detail rather than a settings change. Until the required
    # list is narrowed to `ci-gate` alone, both lists have to stay in step.
    # What unchaining costs is only compute on a red
    # run: verify's smokes run even when a test job fails, which on a free
    # public repo is minutes, not money.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WHITEBOARD_CHROME_PATH: /usr/bin/google-chrome-stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unused files/deps/exports (knip)
        run: pnpm knip

      # canvas_view serves the built widget from mcp-server/dist/widget even
      # when the server itself runs from source (WHITEBOARD_DEV=1), so the
      # smokes that exercise ui://whiteboard/canvas-view need the widget
      # built and copied before any full `pnpm build` happens in this job.
      - name: Build canvas-viewer widget for smokes
        run: |
          pnpm --filter @kamiazya/whiteboard-canvas-viewer build:widget
          node packages/mcp-server/scripts/copy-widget-into-dist.mjs

      # mcp-smoke spawns the MCP stdio server, which serves in-process.
      # WHITEBOARD_DEV=1 makes it resolve its own tree against source rather
      # than dist, which does not exist before build; the Stdio E2E smoke
      # step below runs the same way.
      - name: Test mcp-smoke
        env:
          WHITEBOARD_DEV: '1'
        run: pnpm exec vitest run --project=mcp-smoke

      - name: Stdio E2E smoke
        env:
          WHITEBOARD_DEV: '1'
        run: pnpm smoke:e2e

      # The artifact a release ships, restored or built as the test jobs do:
      # the package build copies it into dist, `npm pack` refuses a tarball
      # without it, and the web build fails rather than omit it.
      - uses: ./.github/actions/core-wasm

      - name: Build
        env:
          WHITEBOARD_SHIP_CORE_WASM: '1'
        run: pnpm build

      # Runs the packed-tarball / packaged-entry / codex-config distribution
      # vitest suite (vitest.distribution.config.ts) against this dist — the
      # exact npm-install code path that broke a real publish (v0.0.9+) and
      # otherwise only ran via a manual `pnpm test:distribution`. This is the
      # one run of the tarball and codex-config flows: `pnpm smoke:tarball` and
      # `pnpm smoke:codex-config` drive the same *.distribution-impl.ts modules,
      # so they are not steps of their own (release-gate-matrix.test.ts).
      - name: Distribution vitest suite
        run: pnpm --filter @kamiazya/whiteboard-mcp test:distribution:only

      # Here rather than in a job of its own: the pack and checksum take about
      # 2s, and a job that `needs: verify` paid ~100s of queue, setup and a
      # dist download after verify ended, which made it the last job of the
      # run. ci-verify-coverage.test.ts keeps every job off verify.
      - name: npm publish dry-run
        run: pnpm publish:dry-run:npm

      - name: Upload npm dry-run artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball-dry-run-${{ github.run_id }}
          path: packages/mcp-server/tmp/publish-dry-run/
          if-no-files-found: error

      - name: Web app artifact smoke
        run: pnpm --filter @kamiazya/whiteboard-web smoke:artifact

      - name: Web app bundle-size gate
        run: pnpm --filter @kamiazya/whiteboard-web smoke:bundle-size

      - name: Web app PWA precache gate
        run: pnpm --filter @kamiazya/whiteboard-web smoke:pwa-precache

      # An ABSOLUTE floor, not a regression stop — the bundle-size gate above
      # is the regression stop and is seven times finer. This one only refuses
      # a shell that takes over a second to appear on a mid-range phone
      # profile; the reasoning and the measurements are in the script.
      - name: Web app LCP floor
        run: pnpm --filter @kamiazya/whiteboard-web smoke:lcp-floor

      - name: Web app preview-origin behavioral smoke
        run: pnpm --filter @kamiazya/whiteboard-web smoke:preview-origin

      # The service worker's update lifecycle through the BUILT dist/ in real
      # Chromium: install, control, a waiting update accepted through the toast,
      # and the error screen's recovery. The unit tests stand in mocks for the
      # worker, which cannot notice a build whose worker behaves differently.
      - name: Web app PWA update-lifecycle behavioral smoke
        run: pnpm --filter @kamiazya/whiteboard-web smoke:pwa-lifecycle

      # ADR-0044's cross-origin transfer crossed for real: the browser app at
      # one origin sends its workspace to a server-mode keeper at another,
      # built above, whose person signed in through an OIDC provider. The
      # component tests stub the keeper; only this sees the keeper's own
      # headers, where a COOP of same-origin would sever the popup's opener.
      - name: Cross-origin transfer real-browser smoke (ADR-0044)
        run: pnpm smoke:transfer

      # Asks for the Rust core and throws on a difference or a load failure, so
      # a dist without its wasm fails here instead of routing in TypeScript.
      - name: Packaged stdio smoke
        env:
          WHITEBOARD_CORE: differential
          WHITEBOARD_CORE_MISMATCH: throw
        run: pnpm smoke:packaged

      - name: Check release artifacts
        run: pnpm --filter @kamiazya/whiteboard-mcp check:release-artifacts

  # ADR-0050's bridge and ADR-0042's read plane in real browsers. They run
  # from source, build their own extension and web app (smoke-kit.mjs), and
  # consume nothing `verify` produces. Inside `verify` they sat on the
  # verify -> ci-gate chain and added their ~2 minutes to the run's wall
  # clock; as a job of their own they overlap the other jobs.
  # ci-gate.test.ts keeps them out of `verify`.
  extension-smokes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Two commits, so the merge commit's first parent (the base tip) is
      # there to diff against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # This job's share of the change scope, computed here rather than read
      # from the `scope` job: see that job's comment for why there is no hop.
      - name: Detect change scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: node tools/checks/src/affected-cli.mjs job extension-smokes --event "$EVENT"

      - name: Not affected by this change
        if: steps.scope.outputs.run != 'true'
        env:
          REASON: ${{ steps.scope.outputs.reason }}
        # An annotation, so the skip and its reason show on the run summary.
        run: echo "::notice title=Not affected by this change::$REASON"

      - uses: ./.github/actions/setup-pnpm
        if: steps.scope.outputs.run == 'true'

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      # ADR-0050's bridge in a real browser: a real daemon on its socket, the
      # native host `whiteboard native-host` installs, the built extension,
      # headless Chromium. Branded Chrome (WHITEBOARD_CHROME_PATH) ignores
      # --load-extension, so this one runs on Playwright's own Chromium.
      - name: Install Playwright Chromium (extension bridge smoke)
        if: steps.scope.outputs.run == 'true'
        run: pnpm --filter @kamiazya/whiteboard-extension exec playwright install chromium

      - name: Extension bridge smoke
        if: steps.scope.outputs.run == 'true'
        run: pnpm --filter @kamiazya/whiteboard-extension smoke:bridge

      # The same in Firefox, which lets no page message an extension: the
      # page goes through the content script. The runner's Firefox is
      # Mozilla's own build rather than the snap (whose native messaging asks
      # a person through a desktop portal), and its geckodriver sits at
      # $GECKOWEBDRIVER. The Chromium smoke above just built both artifacts.
      - name: Extension bridge smoke (Firefox)
        if: steps.scope.outputs.run == 'true'
        env:
          BRIDGE_SMOKE_PREBUILT: '1'
        run: GECKODRIVER="$GECKOWEBDRIVER/geckodriver" pnpm --filter @kamiazya/whiteboard-extension smoke:bridge:firefox

      # The read plane (ADR-0042) crossed for real, through the extension: a
      # sealed replica in real IndexedDB, the locked page a cold start with
      # the daemon gone lands on, and the daemon page back on Reconnect. The
      # browser-mode tests answer the daemon at `fetch`; this is where the
      # built web app meets it. Here because it needs the extension build and
      # Playwright's Chromium the bridge smokes above just made ready.
      - name: Read-plane real-browser smoke (ADR-0042)
        if: steps.scope.outputs.run == 'true'
        env:
          BRIDGE_SMOKE_PREBUILT: '1'
        run: pnpm --filter @kamiazya/whiteboard-extension smoke:read-plane

  dry-run-docker:
    # No `needs: verify`, deliberately: this job downloads no artifact from
    # verify — it checks out and builds the image from source — so the edge
    # was pure ordering, and it serialized the two longest jobs in the
    # workflow back to back.
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth 2 rather than 0: on a pull_request event the checked-out
      # ref is the merge commit, whose first parent is the base branch tip, so
      # HEAD^1 is the whole PR diff for one extra object instead of a full
      # clone. The detect step below is the only thing that needs it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # The image build is 207s of this job's 260-410s and answers one
      # question: does Dockerfile.server still build? A pull request that
      # touches nothing the image compiles cannot change that answer, and 21
      # of the last 40 main commits were exactly that (all apps/web or
      # .claude). What counts as reaching the image is DERIVED — see
      # tools/checks/src/docker-build-inputs.mjs.
      #
      # Gated per-STEP, not with a job-level `if:` or a workflow `paths:`
      # filter. A `paths:` filter never reports the check at all and stalls a
      # required-check merge; a job-level `if:` would need its own upstream
      # job, and measured queue pickup here is 35-276s — a second hop can cost
      # more than the build it saves. Skipping inside the job costs one
      # checkout and leaves the check reporting normally.
      - name: Detect docker build inputs
        id: detect
        run: node tools/checks/src/docker-build-inputs.mjs "${{ github.event_name == 'pull_request' && 'HEAD^1' || 'always' }}"

      - uses: ./.github/actions/setup-pnpm
        if: steps.detect.outputs.docker == 'true'

      - name: Install dependencies
        if: steps.detect.outputs.docker == 'true'
        run: pnpm install --frozen-lockfile

      - name: Docker build dry-run
        if: steps.detect.outputs.docker == 'true'
        run: pnpm publish:dry-run:docker

      # The build above is the expensive part and it proves one thing: the
      # Dockerfile still compiles. These two run the image, for no second
      # build — WHITEBOARD_SMOKE_IMAGE hands each smoke the tag the dry-run
      # just produced, so the scenarios reuse it instead of building again.
      # Measured on the first green run: smoke:docker's ten scenarios cost
      # 6.5s on top of the cached build.
      #
      # Both were docker-release-only until now, which meant the container
      # boundary — auth, graceful stop, volume remount, log redaction — was
      # verified for the first time during a publish. That is how three of
      # the four image builds came to be missing a required build arg with
      # every pipeline green.
      - name: Server-mode docker smoke
        if: steps.detect.outputs.docker == 'true'
        env:
          WHITEBOARD_SMOKE_IMAGE: whiteboard-server:dry-run
        run: pnpm smoke:docker

      # The backup/restore smoke joins it now that its one dead assertion is
      # gone. It imports one built module — dist/server/server-mode-backup-
      # restore.js — which the image dry-run does not leave behind, so it gets
      # its own build step. The image itself is still the dry-run's.
      #
      # build:server, not build: the full `build` also copies canvas-viewer's
      # widget into dist, and that package is not built in this job, so it
      # fails on a missing dist/widget/canvas-viewer.html. tsdown produces the
      # module the smoke needs on its own.
      - name: Build mcp-server dist for the backup/restore smoke
        if: steps.detect.outputs.docker == 'true'
        run: pnpm --filter @kamiazya/whiteboard-mcp build:server

      - name: Server-mode backup/restore docker smoke
        if: steps.detect.outputs.docker == 'true'
        env:
          WHITEBOARD_SMOKE_IMAGE: whiteboard-server:dry-run
        run: pnpm smoke:docker-backup-restore

      - name: Upload docker dry-run metadata
        if: steps.detect.outputs.docker == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image-dry-run-${{ github.run_id }}
          path: packages/mcp-server/tmp/publish-dry-run/docker-image-metadata.json
          if-no-files-found: warn

  # ADR-0050 decision 9: on Windows the daemon listens on a named pipe and the
  # native host is registered in the registry. Nothing else here runs on
  # Windows, so without this job no part of that path would ever execute.
  native-host-windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      # Two commits, so the merge commit's first parent (the base tip) is
      # there to diff against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # This job's share of the change scope, computed here rather than read
      # from the `scope` job: see that job's comment for why there is no hop.
      - name: Detect change scope
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: node tools/checks/src/affected-cli.mjs job native-host-windows --event "$EVENT"

      - name: Not affected by this change
        if: steps.scope.outputs.run != 'true'
        shell: bash
        env:
          REASON: ${{ steps.scope.outputs.reason }}
        # An annotation, so the skip and its reason show on the run summary.
        run: echo "::notice title=Not affected by this change::$REASON"

      - uses: ./.github/actions/setup-pnpm
        if: steps.scope.outputs.run == 'true'
        with:
          cache-store: 'false'

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Native host smoke (named pipe + registry)
        if: steps.scope.outputs.run == 'true'
        run: pnpm --filter @kamiazya/whiteboard-extension smoke:native-host

  # The Cargo workspace (crates/, ADR-0054): every merge gate `pnpm
  # rust:check` runs, the wasm release build, and the Linux leg of the release
  # gates. Scoped by PATH (affected.mjs's PATH_JOBS): a change to no Cargo
  # file or crate skips it, and a crates-only change runs it and not the
  # vitest matrix.
  #
  # RUSTFLAGS is left unset on purpose: it silently REPLACES every other
  # source of rustflags, and `cargo xtask dist` builds from its own
  # CARGO_ENCODED_RUSTFLAGS so the size ledger and the reproducibility check
  # measure the bytes that ship.
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      # Two commits, so the merge commit's first parent (the base tip) is
      # there to diff against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # This job's share of the change scope, computed here rather than read
      # from the `scope` job: see that job's comment for why there is no hop.
      - name: Detect change scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: node tools/checks/src/affected-cli.mjs job rust --event "$EVENT"

      - name: Not affected by this change
        if: steps.scope.outputs.run != 'true'
        env:
          REASON: ${{ steps.scope.outputs.reason }}
        # An annotation, so the skip and its reason show on the run summary.
        run: echo "::notice title=Not affected by this change::$REASON"

      # The rust:* scripts are Node, and pnpm refuses to run a script over an
      # uninstalled workspace.
      - uses: ./.github/actions/setup-pnpm
        if: steps.scope.outputs.run == 'true'

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      # rust-toolchain.toml pins the channel, its components and the wasm32
      # target; a bare `toolchain install` reads it (rustup >= 1.28 no longer
      # installs on `rustup show`).
      - name: Rust toolchain (rust-toolchain.toml)
        if: steps.scope.outputs.run == 'true'
        run: |
          rustup toolchain install
          rustup show

      # Prebuilt binaries at the versions the scripts name; `fallback: none`
      # so a version the action cannot provide fails here instead of quietly
      # building from source or installing another one.
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        if: steps.scope.outputs.run == 'true'
        with:
          tool: cargo-deny@0.20.2,wasm-bindgen@0.2.130,cargo-auditable@0.7.7,cargo-about@0.9.3,cargo-llvm-cov@0.9.1
          fallback: none

      # Both workspaces' dependency builds, keyed on the toolchain and each
      # Cargo.lock (crates/fuzz has its own). Saved from main only, so pull
      # requests restore one shared entry instead of each filling the cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.scope.outputs.run == 'true'
        with:
          workspaces: |
            . -> target
            crates/fuzz -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Rust merge gates (fmt, clippy, tests, xtask guards, cargo-deny)
        if: steps.scope.outputs.run == 'true'
        run: pnpm rust:check

      - name: Wasm release build (cargo xtask dist wasm)
        if: steps.scope.outputs.run == 'true'
        run: pnpm rust:build:wasm

      # QR-21 layer 2: TypeScript against the wasm just built, exact equality.
      - name: TypeScript-against-wasm differential (canvas-render-rust)
        if: steps.scope.outputs.run == 'true'
        run: pnpm exec vitest run --project=canvas-render-rust

      # The core-wasm shim over the artifact just built: staged into the
      # package, its hand-written glue declaration held to the generated one,
      # and its own tests run against the real instance.
      - name: Stage the wasm artifact into core-wasm
        if: steps.scope.outputs.run == 'true'
        run: pnpm --filter @kamiazya/whiteboard-core-wasm stage:wasm

      - name: core-wasm glue declaration against the generated one
        if: steps.scope.outputs.run == 'true'
        run: pnpm --filter @kamiazya/whiteboard-core-wasm typecheck:abi

      - name: core-wasm shim over the artifact (core-wasm-rust)
        if: steps.scope.outputs.run == 'true'
        run: pnpm exec vitest run --project=core-wasm-rust

      - name: Rust release gates (dist native, harden-check, repro-check, notices)
        if: steps.scope.outputs.run == 'true'
        run: pnpm rust:release:check

  # The fuzz targets a change can reach, about 30 s each without a sanitizer
  # (`pnpm rust:fuzz:pr`); rust-fuzz-nightly.yml runs every target for
  # minutes under ASan. Same scope as `rust`. A pull request selects targets
  # by its diff against the base tip (HEAD^1 of the merge commit); every other
  # event runs them all, since it has no diff to select by.
  rust-fuzz-pr:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      # Two commits, so the merge commit's first parent (the base tip) is
      # there to diff against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # This job's share of the change scope, computed here rather than read
      # from the `scope` job: see that job's comment for why there is no hop.
      - name: Detect change scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: node tools/checks/src/affected-cli.mjs job rust-fuzz-pr --event "$EVENT"

      - name: Not affected by this change
        if: steps.scope.outputs.run != 'true'
        env:
          REASON: ${{ steps.scope.outputs.reason }}
        # An annotation, so the skip and its reason show on the run summary.
        run: echo "::notice title=Not affected by this change::$REASON"

      # The rust:* scripts are Node, and pnpm refuses to run a script over an
      # uninstalled workspace.
      - uses: ./.github/actions/setup-pnpm
        if: steps.scope.outputs.run == 'true'

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Pinned nightly toolchain (crates/fuzz/rust-toolchain.toml)
        if: steps.scope.outputs.run == 'true'
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' crates/fuzz/rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component llvm-tools --component rust-src

      # Restore-only, from the nightly run's entry: its corpus seeds the
      # short run, and its cargo-fuzz install saves a source build. The path
      # list must equal the nightly's exactly — it is part of the cache key.
      - name: Restore the nightly corpus, fuzz build and cargo-fuzz
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            crates/fuzz/corpus
            crates/fuzz/target
            ~/.cargo/bin/cargo-fuzz
          key: rust-fuzz-corpus-
          restore-keys: rust-fuzz-corpus-

      - name: cargo-fuzz
        if: steps.scope.outputs.run == 'true'
        run: cargo fuzz --version || cargo install --locked cargo-fuzz --version 0.13.2

      - name: Fuzz the targets this change reaches
        if: steps.scope.outputs.run == 'true'
        env:
          EVENT: ${{ github.event_name }}
          RUST_FUZZ_BASE: HEAD^1
        run: |
          if [ "$EVENT" = pull_request ]; then
            pnpm rust:fuzz:pr
          else
            pnpm rust:fuzz:pr --all
          fi

      - name: Upload fuzz findings
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-fuzz-pr-findings
          path: |
            crates/fuzz/artifacts
            crates/fuzz/regressions
          retention-days: 14

  # QR-17: every mutant in this change's Rust lines must be caught by the
  # workspace's tests, or ledgered in .cargo/mutants.toml with its reason.
  # `cargo mutants --in-diff` against the merge commit's first parent, after a
  # separate green test step (the run skips its own baseline), sharded with
  # identical arguments so one slow shard never hides another's result. The
  # edge crate is judged by the wasm crate's replay of the TypeScript's
  # recorded answers (crates/bindings/wasm/tests/recorded_oracle.rs), its
  # oracle in native form. tools/checks/src/rust-mutants.mjs reads the exit
  # codes as QR-17 does: missed, timed out and a failed baseline all fail.
  rust-mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      # One shard failing must not cancel its siblings: a cancelled job is not
      # a failed one, so "Re-run failed jobs" never revives it.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      # Two commits, so the merge commit's first parent is there to diff against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect change scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: node tools/checks/src/affected-cli.mjs job rust-mutants --event "$EVENT"

      - name: Not affected by this change
        if: steps.scope.outputs.run != 'true'
        env:
          REASON: ${{ steps.scope.outputs.reason }}
        run: echo "::notice title=Not affected by this change::$REASON"

      - uses: ./.github/actions/setup-pnpm
        if: steps.scope.outputs.run == 'true'

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Rust toolchain (rust-toolchain.toml)
        if: steps.scope.outputs.run == 'true'
        run: rustup toolchain install

      # Built from source once per version and cached by it: the version is
      # the cache key, so a bump installs fresh and an old binary never runs.
      - name: Restore cargo-mutants
        if: steps.scope.outputs.run == 'true'
        id: mutants-bin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-mutants
          key: cargo-mutants-27.1.0

      - name: cargo-mutants
        if: steps.scope.outputs.run == 'true' && steps.mutants-bin.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-mutants --version 27.1.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.scope.outputs.run == 'true'

      # The baseline, on its own: a red tree would otherwise read as every
      # mutant caught.
      - name: Workspace tests (the baseline)
        if: steps.scope.outputs.run == 'true'
        run: cargo test --workspace --locked

      # A push to main judges the merged change the same way, against HEAD^1:
      # the whole workspace still holds survivors nobody has classified, so a
      # full run here would fail every merge on mutants it did not add.
      - name: Mutants in this change (shard ${{ matrix.shard }}/4)
        if: steps.scope.outputs.run == 'true'
        env:
          RUST_MUTANTS_BASE: HEAD^1
          RUST_MUTANTS_SHARD: ${{ matrix.shard }}/4
        run: pnpm rust:mutants:pr

      - name: Upload the mutants report
        if: failure() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-mutants-shard-${{ matrix.shard }}
          path: mutants.out
          retention-days: 14

  # zizmor (https://docs.zizmor.sh): static analysis of the workflows and
  # composite actions themselves — template injection, credential persistence,
  # dangerous triggers, excessive permissions, and impostor commits behind a
  # pinned SHA (the online audits). A finding at the `regular` persona fails
  # the job; a deliberate exception is an inline `# zizmor: ignore[<rule>]` or
  # an entry in .github/zizmor.yml, each with its reason beside it.
  #
  # Run the same audit locally with `uvx zizmor@1.32.0 .github/` (or pipx).
  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Fail the job on a finding. With advanced security on, the action
          # uploads SARIF and exits 0, which gates nothing.
          advanced-security: false
          version: 1.32.0
          persona: regular
          config: .github/zizmor.yml

  # Fails a pull request that ADDS a dependency with a known vulnerability,
  # read from the dependency graph's diff between base and head
  # (https://github.com/actions/dependency-review-action). It is the
  # per-change half of the policy in docs/contributing/security-baseline.md
  # (OSPS-VM-05.03): `pnpm audit:prod` in the check job and audit.yml judge
  # the whole tree, this judges what the change introduces — including a
  # manifest ecosystem pnpm does not audit, such as the GitHub Actions a
  # workflow pins.
  #
  # The threshold matches `pnpm audit:prod`'s `--audit-level=high` over runtime
  # scope, so one advisory is not a blocker in one gate and noise in the other.
  #
  # Pull requests only: the action diffs base against head, which a push to
  # main or a merge_group commit does not give it. ci-gate declares the skip.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review added dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          # A summary comment needs pull-requests: write; the job summary
          # carries the same table without it.
          comment-summary-in-pr: never
          # Advisories suppressed as not exploitable, with the reason for each
          # in .github/security/whiteboard.openvex.json. Must equal
          # pnpm-workspace.yaml's auditConfig.ignoreGhsas
          # (vex-audit-ignores.test.ts).
          allow-ghsas: GHSA-qwww-vcr4-c8h2, GHSA-hp3w-g68c-fv3c

  # The change scope of this run, for ci-gate and the run summary: which
  # vitest projects and jobs a pull request reaches (tools/checks/src/
  # affected.mjs). Any event but pull_request selects everything, and so does
  # any changed path no rule attributes.
  #
  # Nothing `needs` this job but ci-gate. Each scoped job computes its own
  # share of the same plan in its first step — same code, same checkout —
  # rather than waiting on these outputs, because a `needs` hop costs a second
  # runner pickup (35-276s measured here) on the critical path of EVERY run,
  # and the replay over 120 merged pull requests (affected-replay.mjs) found
  # nearly all of them reach apps/web and so run the longest job anyway: a hop
  # would have lengthened almost every run to shorten almost none. ci-gate
  # holds each job's skip to this plan, so a job cannot skip work the plan
  # says it needed.
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Compute the change scope
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: node tools/checks/src/affected-cli.mjs plan --event "$EVENT"

  # The single required status check for this workflow — require THIS and
  # nothing else from ci.yml, and a shard count stops being a settings change.
  # See tools/checks/src/ci-gate.mjs for what it refuses and why it judges the
  # run's per-leg conclusions rather than `needs.<job>.result`.
  #
  # `if: always()` is load-bearing: without it a failed dependency SKIPS this
  # job, so the one check branch protection waits on never reports and the
  # merge blocks on an absent check rather than on the real failure.
  #
  # Every ci.yml job must appear in `needs` — for ordering, and as the list the
  # gate cross-checks the run against. ci-gate.test.ts fails on a missing one.
  ci-gate:
    if: always()
    needs:
      - scope
      - check
      - test-unit
      - test-shared
      - test-jsdom
      - test-browser
      - stress-changed-tests
      - sbom-npm
      - packaged-smoke
      - widget-smoke
      - native-host-windows
      - extension-smokes
      - verify
      - dry-run-docker
      - rust
      - rust-fuzz-pr
      - rust-mutants
      - zizmor
      - dependency-review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # A job-level block REPLACES the workflow's `contents: read` rather than
    # adding to it, so checkout's own permission is restated here.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every job in this run succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/checks/src/ci-gate.mjs
