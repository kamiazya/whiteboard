name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Validate PR title
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: pnpm check:pr-title -- "$PR_TITLE"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit (high+ vulnerabilities, prod deps only)
        # Gate on CVEs that affect published artifacts so they are caught at PR time.
        run: pnpm audit --prod --audit-level=high

      - name: Validate skills
        run: pnpm intent:validate

      - name: Secret scan (secretlint)
        run: pnpm secretlint

      # Staged biome adoption: enforce the AGENTS.md "no console.* in server
      # runtime" rule in CI. Full biome check is not wired yet (the repo still
      # carries pre-existing format/organizeImports violations); this gate stops
      # new server-runtime console.* from landing without requiring that cleanup.
      - name: Lint (server noConsole gate)
        run: pnpm lint:noconsole

      - name: Typecheck
        run: pnpm typecheck

  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Shard mcp-node (largest suite) across 2 parallel runners.
      # --shard splits the collected spec list so each runner handles a disjoint half.
      - name: Test mcp-node (shard ${{ matrix.shard }}/2)
        run: pnpm exec vitest run --project=mcp-node --shard=${{ matrix.shard }}/2

  test-jsdom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test mcp-jsdom
        run: pnpm exec vitest run --project=mcp-jsdom

      - name: Test web (jsdom)
        run: pnpm --filter @kamiazya/whiteboard-web exec vitest run

  test-browser:
    runs-on: ubuntu-latest
    # Run directly on ubuntu-latest (no Docker container). Using a container image
    # triggers Docker's default seccomp profile which blocks syscalls that Vite 8's
    # Rolldown-based dep optimizer needs at init time, causing a 30-minute hang.
    # The ubuntu-latest runner has no seccomp restrictions so Rolldown works normally.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(packages/mcp-server/node_modules/.bin/playwright --version)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: packages/mcp-server/node_modules/.bin/playwright install --with-deps chromium

      - name: Install Playwright system dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: packages/mcp-server/node_modules/.bin/playwright install-deps chromium

      # Cache the Vite dep optimizer output so subsequent runs with the same
      # lockfile skip bundling entirely (fastest path).
      - name: Cache Vite dep optimizer output
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            packages/mcp-server/node_modules/.vite
            apps/web/node_modules/.vite
          key: vite-deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Test mcp-browser
        run: pnpm exec vitest run --project=mcp-browser

      - name: Test web-browser
        run: pnpm --filter @kamiazya/whiteboard-web exec vitest run --config vitest.browser.config.ts

  verify:
    needs: [check, test-unit, test-jsdom, test-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: pw-version-verify
        run: echo "version=$(packages/mcp-server/node_modules/.bin/playwright --version)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache-verify
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version-verify.outputs.version }}

      - name: Install Playwright browsers and system dependencies
        if: steps.playwright-cache-verify.outputs.cache-hit != 'true'
        run: packages/mcp-server/node_modules/.bin/playwright install --with-deps chromium

      - name: Install Playwright system dependencies (cache hit)
        if: steps.playwright-cache-verify.outputs.cache-hit == 'true'
        run: packages/mcp-server/node_modules/.bin/playwright install-deps chromium

      # mcp-smoke spawns the MCP stdio server which in turn calls ensureDaemon.
      # Without WHITEBOARD_DEV=1, ensureDaemon tries dist/server/index.js which
      # does not exist before build. WHITEBOARD_DEV=1 makes it use tsx against
      # source instead, matching how pnpm smoke:e2e runs the same flow.
      - name: Test mcp-smoke
        env:
          WHITEBOARD_DEV: '1'
        run: pnpm exec vitest run --project=mcp-smoke

      - name: Stdio E2E smoke
        env:
          WHITEBOARD_DEV: '1'
        run: pnpm smoke:e2e

      - name: Template smoke
        run: pnpm smoke:template

      - name: Build
        run: pnpm build

      - name: Web app artifact smoke
        run: pnpm --filter @kamiazya/whiteboard-web smoke:artifact

      - name: Web app preview-origin behavioral smoke
        run: pnpm --filter @kamiazya/whiteboard-web smoke:preview-origin

      - name: Packaged stdio smoke
        run: pnpm smoke:packaged

      - name: Packed tarball smoke
        run: pnpm smoke:tarball

      - name: Codex config smoke
        run: pnpm smoke:codex-config

      - name: Check release artifacts
        run: pnpm --filter @kamiazya/whiteboard-mcp check:release-artifacts

  dry-run-npm:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: npm publish dry-run
        run: pnpm publish:dry-run:npm

      - name: Upload npm dry-run artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tarball-dry-run-${{ github.run_id }}
          path: packages/mcp-server/tmp/publish-dry-run/
          if-no-files-found: error

  dry-run-docker:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Docker build dry-run
        run: pnpm publish:dry-run:docker

      - name: Upload docker dry-run metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-image-dry-run-${{ github.run_id }}
          path: packages/mcp-server/tmp/publish-dry-run/docker-image-metadata.json
          if-no-files-found: warn
