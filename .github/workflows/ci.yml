name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Validate PR title
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: pnpm check:pr-title -- "$PR_TITLE"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit (high+ vulnerabilities, prod deps only)
        # Gate on CVEs that affect published artifacts so they are caught at PR time.
        run: pnpm audit --prod --audit-level=high

      - name: Validate skills
        run: pnpm intent:validate

      - name: Secret scan (secretlint)
        run: pnpm secretlint

      # Staged biome adoption: enforce the AGENTS.md "no console.* in server
      # runtime" rule in CI. Full biome check is not wired yet (the repo still
      # carries pre-existing format/organizeImports violations); this gate stops
      # new server-runtime console.* from landing without requiring that cleanup.
      - name: Lint (server noConsole gate)
        run: pnpm lint:noconsole

      - name: Typecheck
        run: pnpm typecheck

  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Shard mcp-node (largest suite) across 2 parallel runners.
      # --shard splits the collected spec list so each runner handles a disjoint half.
      - name: Test mcp-node (shard ${{ matrix.shard }}/2)
        run: pnpm exec vitest run --project=mcp-node --shard=${{ matrix.shard }}/2

  test-jsdom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test mcp-jsdom
        run: pnpm exec vitest run --project=mcp-jsdom

      - name: Test web (jsdom)
        run: pnpm --filter @kamiazya/whiteboard-web exec vitest run

  test-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # mcp-smoke has maxWorkers:1 and 60 s timeouts; runs separately so it
      # does not block the faster unit and jsdom shards.
      - name: Test mcp-smoke
        run: pnpm exec vitest run --project=mcp-smoke

  test-browser:
    runs-on: ubuntu-latest
    # Run inside the official Playwright image so Chromium is prebaked at
    # /ms-playwright — no download or extraction step needed. The image version
    # must be kept in sync with the `playwright` version in pnpm-lock.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 20
    env:
      # Prevent postinstall from trying to fetch a browser; the image has it.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test mcp-browser
        run: pnpm exec vitest run --project=mcp-browser

      - name: Test web-browser
        run: pnpm --filter @kamiazya/whiteboard-web exec vitest run --config vitest.browser.config.ts

  verify:
    needs: [check, test-unit, test-jsdom, test-smoke, test-browser]
    runs-on: ubuntu-latest
    # Run inside the official Playwright image so Chromium is prebaked at
    # /ms-playwright — no download or extraction step needed. The image version
    # must be kept in sync with the `playwright` version in pnpm-lock.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 30
    env:
      # Prevent postinstall from trying to fetch a browser; the image has it.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stdio E2E smoke
        env:
          WHITEBOARD_DEV: '1'
        run: pnpm smoke:e2e

      - name: Template smoke
        run: pnpm smoke:template

      - name: Build
        run: pnpm build

      - name: Web app artifact smoke
        run: pnpm --filter @kamiazya/whiteboard-web smoke:artifact

      - name: Web app preview-origin behavioral smoke
        run: pnpm --filter @kamiazya/whiteboard-web smoke:preview-origin

      - name: Packaged stdio smoke
        run: pnpm smoke:packaged

      - name: Packed tarball smoke
        run: pnpm smoke:tarball

      - name: Codex config smoke
        run: pnpm smoke:codex-config

      - name: Check release artifacts
        run: pnpm --filter @kamiazya/whiteboard-mcp check:release-artifacts

  dry-run-npm:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: npm publish dry-run
        run: pnpm publish:dry-run:npm

      - name: Upload npm dry-run artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tarball-dry-run-${{ github.run_id }}
          path: packages/mcp-server/tmp/publish-dry-run/
          if-no-files-found: error

  dry-run-docker:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Docker build dry-run
        run: pnpm publish:dry-run:docker

      - name: Upload docker dry-run metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-image-dry-run-${{ github.run_id }}
          path: packages/mcp-server/tmp/publish-dry-run/docker-image-metadata.json
          if-no-files-found: warn
