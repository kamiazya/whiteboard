# Automated release workflow built around Conventional Commits (monorepo-aware).
#
# Layout:
#   - Root `@kamiazya/whiteboard-plugin` = Claude Code Plugin (private, not published to npm)
#     release-please keeps versions in sync between plugin.json and package.json
#   - `packages/mcp-server` = `@kamiazya/whiteboard-mcp` (published to npm)
#     referenced from plugin.json through `npx -y @kamiazya/whiteboard-mcp@latest`
#
# Flow:
#   1. Push Conventional Commits such as feat:, fix:, or chore: to main
#   2. release-please opens one grouped PR titled "chore: release main" (linked-versions)
#   3. A maintainer reviews and merges it
#   4. After merge, `build-mcp` and `build-docker` gate and build the artifacts
#      when the target package reports release_created=true, and `publish-mcp`
#      and `docker-publish-sign` publish what they built; when any release was
#      created, `build-web` builds apps/web and `deploy-web` deploys that build
#
# “Please release” means “merge the Release PR created by release-please.”

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_publish_tag:
        description: 'Tag to re-run publishing for, e.g. mcp-server-v0.0.2. Leave blank to run neither half. Which halves run is chosen by publish_npm and publish_docker.'
        required: false
        default: ''
      # Each half is retried on its own: npm publish fails on a version npm
      # already has, so re-running only the image must not schedule it, and the
      # reverse for a failed npm publish. Both default on, which is what a
      # dispatch did before the split.
      publish_npm:
        description: 'With a tag: run publish-mcp (npm publish, which fails on a version npm already has).'
        type: boolean
        default: true
      publish_docker:
        description: 'With a tag: run docker-publish-sign (pushes the image and re-tags latest).'
        type: boolean
        default: true

# No workflow-level `permissions` block on purpose: a write granted here is
# ambient to every job that does not override it, and the only job that needs
# one is release-please. Every other job declares its own, so moving
# the grant down changes what they get by exactly nothing and removes a
# standing write from whichever job is added next. A job-level block REPLACES
# the workflow-level one rather than adding to it, which is what makes this
# safe — and also what made the old block invisible to four of five jobs.
# ci-policy.test.ts fails on a write reappearing at the root, or on a job that
# declares no permissions of its own.

jobs:
  release-please:
    runs-on: ubuntu-24.04
    # Needed for release-please: write PRs, create tags/releases.
    # packages: write is NOT included — it is scoped to docker-publish-sign.
    permissions:
      contents: write
      pull-requests: write
    outputs:
      mcp_release_created: ${{ steps.release.outputs['packages/mcp-server--release_created'] }}
      mcp_tag_name: ${{ steps.release.outputs['packages/mcp-server--tag_name'] }}
      # Root-path (".") outputs are NOT path-prefixed: release-please-action
      # emits plain `release_created` / `tag_name` for the root component.
      # The previous `['--release_created']` keys never existed, so
      # advance-stable was silently skipped on every release.
      root_release_created: ${{ steps.release.outputs.release_created }}
      root_tag_name: ${{ steps.release.outputs.tag_name }}
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Use a PAT (RELEASE_PLEASE_TOKEN) so PRs opened by release-please trigger ci.yml.
          # GITHUB_TOKEN-driven actions cannot trigger workflows on other workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # Fast-forward the `stable` branch to the root (plugin) release tag.
  # Git-based plugin consumers (Claude Code marketplace source ref, Codex
  # `@stable` marketplaces) resolve `stable`, so plugin content ships on
  # release-PR merge instead of on every push to main.
  advance-stable:
    needs: release-please
    if: ${{ needs.release-please.outputs.root_release_created == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Keeps the token in .git/config on purpose: the push below uses it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fast-forward stable to the release tag
        env:
          TAG: ${{ needs.release-please.outputs.root_tag_name }}
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" --no-tags || true
          git rev-parse --verify "refs/tags/${TAG}^{commit}" >/dev/null
          # No force flag: a non-fast-forward means history was rewritten — fail loudly.
          git push origin "refs/tags/${TAG}^{commit}:refs/heads/stable"

  # Each publish half is two jobs. The BUILD job checks out the tag, installs
  # dependencies and runs the gates with `contents: read` and nothing else, so
  # no lifecycle script, test or smoke it runs can mint the OIDC token or read
  # a registry push token. The PUBLISH job holds those credentials, checks out
  # nothing and runs no repository or dependency code: it downloads the
  # artifact the build job produced, checks it against the sha256 that job
  # reported, and publishes it. ci-policy.test.ts holds both halves of that.
  build-mcp:
    needs: release-please
    if: ${{ needs.release-please.outputs.mcp_release_created == 'true' || (inputs.force_publish_tag != '' && inputs.publish_npm) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      tarball_sha256: ${{ steps.pack.outputs.sha256 }}
    env:
      # The smoke's first tools/call opens the packaged store cold (native
      # modules, WASM, first-run migrations), which exceeds the default RPC
      # deadline on CI runners ("RPC tools/call timed out", v0.0.10).
      WHITEBOARD_SMOKE_RPC_TIMEOUT_MS: '90000'
    defaults:
      run:
        working-directory: packages/mcp-server
    steps:
      - name: Validate tag shape
        # Runs before checkout: the job-default working-directory does not exist yet,
        # so this step must override it or bash fails to start.
        working-directory: .
        env:
          TAG: ${{ inputs.force_publish_tag || needs.release-please.outputs.mcp_tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^mcp-server-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not match mcp-server-v<semver>"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.force_publish_tag != '' && inputs.force_publish_tag || needs.release-please.outputs.mcp_tag_name }}
          persist-credentials: false

      - name: Refuse a forced publish whose provenance would name another commit
        # `npm publish --provenance` attests GITHUB_SHA, the commit the
        # dispatch ran from, while this job packs the tag checked out above.
        # They agree only when the dispatch itself ran from the tag, and the
        # provenance names the dispatched ref too: from main at the tag's own
        # commit, the HEAD check passes yet the identity is refs/heads/main.
        if: inputs.force_publish_tag != ''
        working-directory: .
        env:
          FORCE_PUBLISH_TAG: ${{ inputs.force_publish_tag }}
        run: |
          head=$(git rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::Checked-out tag is $head but this run attests $GITHUB_SHA. Dispatch the forced publish from the tag itself: gh workflow run release.yml --ref <tag> -f force_publish_tag=<tag>"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/tags/$FORCE_PUBLISH_TAG" ]; then
            echo "::error::This run was dispatched from $GITHUB_REF, which the attestation names, not refs/tags/$FORCE_PUBLISH_TAG. Dispatch the forced publish from the tag itself: gh workflow run release.yml --ref <tag> -f force_publish_tag=<tag>"
            exit 1
          fi

      - uses: ./.github/actions/setup-pnpm
        with:
          # Pinned inline (not via .node-version) because build-mcp checks out an old tag whose
          # source tree may predate .node-version.
          # local-node-version.test.ts fails when this drifts from .node-version.
          node-version: 24
          # A cold store: this job's output is published, and the store cache is
          # written by default-branch jobs that run every dev and test dependency.
          cache-store: 'false'

      - name: Install dependencies (workspace root)
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: .
        run: pnpm --filter @kamiazya/whiteboard-mcp exec playwright install --with-deps chromium

      - name: Audit (publish gate)
        working-directory: .
        run: pnpm audit --prod --audit-level=high

      - name: Publish gate (publishability tier; correctness proven by verify CI at this SHA)
        # Runs the "publish" tier of tests/e2e/distribution/release-gate-matrix.json:
        # typecheck, mcp-node floor, build, artifact checks, SBOM generation, and
        # tarball/packaged/distribution smokes. It deliberately does NOT re-run the
        # full web (jsdom)/web-browser matrix — that already ran on this
        # exact commit in ci.yml's verify job before the release PR was merged. See
        # docs/contributing/releasing.md "Publish gate scope".
        #
        # No WHITEBOARD_DEV here: every publish-tier gate that spawns the
        # daemon runs after `build` (itself a publish-tier gate, always first
        # in matrix order), so dist/ already exists and the daemon spawns in
        # production mode. See docs/contributing/development.md
        # "Shared-channel hygiene" for why env is passed explicitly per step
        # rather than left ambient at job scope.
        working-directory: .
        run: pnpm publish-gate

      - name: Verify pack contents (README / LICENSE / no test artifacts / no internal _artifacts)
        # Sanity-check the tarball contents before publish. Fail immediately if required files are missing or forbidden files are included.
        run: node ../../tools/checks/src/verify-pack-contents.mjs

      - name: Upload npm SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-sbom-${{ github.run_id }}
          path: packages/mcp-server/_artifacts/npm-sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Pack the tarball
        # `pnpm pack` replaces the `catalog:` protocol in package.json with
        # concrete version ranges inside the tarball — npm itself cannot
        # resolve `catalog:` and would otherwise publish a broken manifest.
        id: pack
        run: |
          set -eu
          TARBALL=$(pnpm pack | tail -1)
          name=$(basename "$TARBALL")
          mkdir -p "$RUNNER_TEMP/npm-tarball"
          mv "$TARBALL" "$RUNNER_TEMP/npm-tarball/$name"
          echo "tarball=$name" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/npm-tarball/$name" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Audit what a consumer installs from this tarball
        # `pnpm audit` above reads the lockfile, which has the workspace's
        # overrides applied; the published tarball carries none, so npm
        # resolves its ranges afresh for every consumer. This installs the
        # tarball just packed into an empty directory and audits that.
        working-directory: .
        env:
          TARBALL: ${{ runner.temp }}/npm-tarball/${{ steps.pack.outputs.tarball }}
        run: pnpm audit:published --tarball "$TARBALL"

      - name: Upload the tarball for publish-mcp
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball-${{ github.run_id }}
          path: ${{ runner.temp }}/npm-tarball/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  build-docker:
    needs: release-please
    if: ${{ needs.release-please.outputs.mcp_release_created == 'true' || (inputs.force_publish_tag != '' && inputs.publish_docker) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      image_sha256: ${{ steps.archive.outputs.sha256 }}
    env:
      # The smoke's first tools/call opens the packaged store cold (native
      # modules, WASM, first-run migrations), which exceeds the default RPC
      # deadline on CI runners ("RPC tools/call timed out", v0.0.10).
      WHITEBOARD_SMOKE_RPC_TIMEOUT_MS: '90000'
    steps:
      - name: Validate tag shape
        env:
          TAG: ${{ inputs.force_publish_tag || needs.release-please.outputs.mcp_tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^mcp-server-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not match mcp-server-v<semver>"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.force_publish_tag != '' && inputs.force_publish_tag || needs.release-please.outputs.mcp_tag_name }}
          persist-credentials: false

      - name: Refuse a forced publish whose signature would name another commit
        # The image's provenance and the cosign certificate name GITHUB_SHA and
        # the dispatched ref, while this job builds the tag checked out above.
        # Dispatched from main, a tag main never held would be signed as
        # release.yml@refs/heads/main — and so would the tag's own commit
        # dispatched from main, which is why the ref is checked as well as the
        # commit. They agree only when the dispatch ran from the tag itself.
        if: inputs.force_publish_tag != ''
        env:
          FORCE_PUBLISH_TAG: ${{ inputs.force_publish_tag }}
        run: |
          head=$(git rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::Checked-out tag is $head but this run attests $GITHUB_SHA. Dispatch the forced publish from the tag itself: gh workflow run release.yml --ref <tag> -f force_publish_tag=<tag>"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/tags/$FORCE_PUBLISH_TAG" ]; then
            echo "::error::This run was dispatched from $GITHUB_REF, which the attestation names, not refs/tags/$FORCE_PUBLISH_TAG. Dispatch the forced publish from the tag itself: gh workflow run release.yml --ref <tag> -f force_publish_tag=<tag>"
            exit 1
          fi

      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: 24
          # A cold store: this job's output is published, and the store cache is
          # written by default-branch jobs that run every dev and test dependency.
          cache-store: 'false'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @kamiazya/whiteboard-mcp exec playwright install --with-deps chromium

      # Publishability only, like build-mcp: the full `pnpm test` matrix ran
      # on this SHA in verify CI, and re-running it here on one runner made
      # every load-dependent test a way to block the image. No WHITEBOARD_DEV:
      # publish-gate runs `build` before any smoke, so dist/ exists by the
      # time a daemon spawn would need it.
      - name: Publish gate (docker)
        run: pnpm publish-gate

      - name: Docker smoke (auth, graceful stop, volume remount, log redaction)
        run: pnpm smoke:docker

      - name: Docker backup and restore smoke
        run: pnpm smoke:docker-backup-restore

      # Dockerfile.server's ARG NODE_VERSION has no default, so a build that
      # omits it resolves `FROM node:${NODE_VERSION}-slim` to `node:-slim`
      # and fails. Read from .node-version, with the same inline fallback and
      # for the same reason as the setup-pnpm pin above: this job checks out a
      # release tag, and an old enough tag predates that file. A build-arg the
      # Dockerfile at such a tag does not declare is a warning, not a failure.
      - name: Resolve NODE_VERSION build arg
        id: node-version
        run: |
          echo "value=$(cat .node-version 2>/dev/null || echo 24)" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/docker-image"

      # The docker-container driver, because the default `docker` driver
      # cannot export an OCI archive with attestations in it.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built into an OCI archive rather than pushed: the SBOM and provenance
      # attestations travel inside the archive's index, so the publish job
      # pushes them with the image without building anything. A `docker load`
      # would drop them.
      - name: Build the Docker image into an OCI archive
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.server
          build-args: |
            NODE_VERSION=${{ steps.node-version.outputs.value }}
          tags: ghcr.io/${{ github.repository }}:${{ inputs.force_publish_tag || needs.release-please.outputs.mcp_tag_name }}
          outputs: type=oci,dest=${{ runner.temp }}/docker-image/image.tar
          sbom: true
          provenance: true

      - name: Hash the image archive
        id: archive
        run: echo "sha256=$(sha256sum "$RUNNER_TEMP/docker-image/image.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload the image archive for docker-publish-sign
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image-${{ github.run_id }}
          path: ${{ runner.temp }}/docker-image/image.tar
          if-no-files-found: error
          retention-days: 7
          # The layers inside are already compressed.
          compression-level: 0

  publish-mcp:
    needs: [release-please, build-mcp]
    if: ${{ needs.release-please.outputs.mcp_release_created == 'true' || (inputs.force_publish_tag != '' && inputs.publish_npm) }}
    runs-on: ubuntu-24.04
    environment: production-npm
    permissions:
      contents: read
      id-token: write  # npm provenance (OIDC) for signed publish on npm v9.5+
    steps:
      # Node 24 ships with npm 11.x, which already meets Trusted Publishing's
      # >= 11.5.1 requirement and avoids the `npm i -g npm@latest` bug.
      # local-node-version.test.ts fails when this drifts from .node-version.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download the tarball build-mcp packed
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball-${{ github.run_id }}
          path: ${{ runner.temp }}/npm-tarball

      - name: Verify the tarball against build-mcp's digest
        env:
          TARBALL_NAME: ${{ needs.build-mcp.outputs.tarball }}
          TARBALL_SHA256: ${{ needs.build-mcp.outputs.tarball_sha256 }}
        run: |
          set -eu
          if [[ ! "$TARBALL_NAME" =~ ^[A-Za-z0-9._-]+\.tgz$ ]]; then
            echo "::error::build-mcp reported no usable tarball name: '$TARBALL_NAME'"
            exit 1
          fi
          cd "$RUNNER_TEMP/npm-tarball"
          echo "$TARBALL_SHA256  $TARBALL_NAME" | sha256sum -c -

      - name: Publish to npm
        # Assumes OIDC Trusted Publisher is configured (no NPM_TOKEN required).
        # npm, not pnpm, publishes: pnpm publish does not perform the npm OIDC
        # token exchange. `--ignore-scripts` because nothing from the package
        # may run in a job that holds the publish credential.
        env:
          TARBALL_NAME: ${{ needs.build-mcp.outputs.tarball }}
        run: |
          set -eu
          TARBALL="$RUNNER_TEMP/npm-tarball/$TARBALL_NAME"
          npm publish "$TARBALL" --access public --provenance --ignore-scripts

  docker-publish-sign:
    needs: [release-please, build-docker]
    if: ${{ needs.release-please.outputs.mcp_release_created == 'true' || (inputs.force_publish_tag != '' && inputs.publish_docker) }}
    runs-on: ubuntu-24.04
    environment: production-docker
    permissions:
      contents: read
      id-token: write   # cosign keyless signing (OIDC)
      packages: write   # GHCR push
    steps:
      - name: Validate tag shape
        env:
          TAG: ${{ inputs.force_publish_tag || needs.release-please.outputs.mcp_tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^mcp-server-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' does not match mcp-server-v<semver>"
            exit 1
          fi

      - name: Download the image archive build-docker built
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image-${{ github.run_id }}
          path: ${{ runner.temp }}/docker-image

      - name: Verify the archive against build-docker's digest
        env:
          IMAGE_SHA256: ${{ needs.build-docker.outputs.image_sha256 }}
        run: |
          set -eu
          cd "$RUNNER_TEMP/docker-image"
          echo "$IMAGE_SHA256  image.tar" | sha256sum -c -

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # skopeo ships on the runner image and reads the login above from
      # ~/.docker/config.json. `--all --preserve-digests` pushes the image
      # index whole, attestation manifests included, and refuses to rewrite
      # any of it, so the digest signed below is the one build-docker built.
      - name: Push the Docker image
        id: push
        env:
          IMAGE_REPO: ghcr.io/${{ github.repository }}
          TAG: ${{ inputs.force_publish_tag || needs.release-please.outputs.mcp_tag_name }}
        run: |
          set -euo pipefail
          archive="oci-archive:$RUNNER_TEMP/docker-image/image.tar"
          skopeo copy --all --preserve-digests --digestfile "$RUNNER_TEMP/digest-tag" "$archive" "docker://$IMAGE_REPO:$TAG"
          skopeo copy --all --preserve-digests --digestfile "$RUNNER_TEMP/digest-latest" "$archive" "docker://$IMAGE_REPO:latest"
          digest=$(cat "$RUNNER_TEMP/digest-tag")
          if [ "$digest" != "$(cat "$RUNNER_TEMP/digest-latest")" ]; then
            echo "::error::$TAG and latest were pushed as different digests"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the Docker image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_REPO: ghcr.io/${{ github.repository }}
        run: cosign sign --yes "$IMAGE_REPO@$DIGEST"

  # The web deploy is split the same way as the publish halves: `build-web`
  # installs and builds apps/web — dependency code — with `contents: read` and
  # no secret, and `deploy-web` holds the Cloudflare token. A secret scoped to
  # one step is no boundary inside one job: a build that ran earlier in the job
  # could rewrite the wrangler the deploy step then runs with the token.
  build-web:
    needs: release-please
    # Skipped when no release happened (e.g. mid-cycle pushes).
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      site_sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm
        with:
          # A cold store: this job's output is published, and the store cache is
          # written by default-branch jobs that run every dev and test dependency.
          cache-store: 'false'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build apps/web
        run: pnpm --filter @kamiazya/whiteboard-web build

      - name: Archive the built site
        id: archive
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/web-site"
          tar -C apps/web/dist -cf "$RUNNER_TEMP/web-site/site.tar" .
          echo "sha256=$(sha256sum "$RUNNER_TEMP/web-site/site.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload the site for deploy-web
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-site-${{ github.run_id }}
          path: ${{ runner.temp }}/web-site/site.tar
          if-no-files-found: error
          retention-days: 7

  deploy-web:
    needs: [release-please, build-web]
    runs-on: ubuntu-24.04
    # Deploy apps/web to Cloudflare Pages when a project release is created.
    # The Deploy step skips itself when Cloudflare secrets are not yet configured.
    # Secrets are scoped to the production-web environment (tag-protected in repo settings).
    # Requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the production-web environment.
    if: needs.release-please.outputs.releases_created == 'true'
    environment:
      name: production-web
      # Surfaces the live production URL in the Environments UI.
      url: https://kamiazya-whiteboard.pages.dev
    permissions:
      contents: read
    # Runs no repository or dependency code: it checks out the deploy tooling
    # alone, installs that lockfile's wrangler with lifecycle scripts off,
    # verifies the site build-web archived, and deploys it. workflow-credentials.test.ts
    # holds every Cloudflare deploy job to this shape.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/deploy

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install the pinned wrangler (lockfile, no lifecycle scripts)
        id: tooling
        working-directory: .github/deploy
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          echo "wrangler=$(jq -r '.packages["node_modules/wrangler"].version' package-lock.json)" >> "$GITHUB_OUTPUT"

      - name: Download the site build-web archived
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-site-${{ github.run_id }}
          path: artifacts/web-site

      - name: Verify the site against build-web's digest, then unpack it
        env:
          SITE_SHA256: ${{ needs.build-web.outputs.site_sha256 }}
        run: |
          set -euo pipefail
          cd artifacts/web-site
          echo "$SITE_SHA256  site.tar" | sha256sum -c -
          mkdir dist
          tar -xf site.tar -C dist --no-same-owner

      - name: Check for the Cloudflare secrets
        id: cf
        # `secrets` cannot be read in a step `if:`, so presence is answered
        # here as a boolean — the values themselves never enter this step.
        env:
          READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: echo "ready=$READY" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The wrangler installed above. An exact wranglerVersion equal to it
          # is what makes the action use it instead of running its own install,
          # so it is read from the same lockfile.
          workingDirectory: .github/deploy
          packageManager: npm
          wranglerVersion: ${{ steps.tooling.outputs.wrangler }}
          command: pages deploy ../../artifacts/web-site/dist --project-name=kamiazya-whiteboard
