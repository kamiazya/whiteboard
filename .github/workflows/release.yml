# Automated release workflow built around Conventional Commits (monorepo-aware).
#
# Layout:
#   - Root `@kamiazya/whiteboard-plugin` = Claude Code Plugin (private, not published to npm)
#     release-please keeps versions in sync between plugin.json and package.json
#   - `packages/mcp-server` = `@kamiazya/whiteboard-mcp` (published to npm)
#     referenced from plugin.json through `npx -y @kamiazya/whiteboard-mcp@latest`
#
# Flow:
#   1. Push Conventional Commits such as feat:, fix:, or chore: to main
#   2. release-please opens a PR like "chore(main): release <pkg> X.Y.Z" for each package
#   3. A maintainer reviews and merges it
#   4. After merge, `publish-mcp` runs when the target package reports release_created=true
#
# “Please release” means “merge the Release PR created by release-please.”

name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_publish_tag:
        description: 'Tag to (re-)publish to npm, e.g. mcp-server-v0.0.2. Leave blank to skip publish-mcp.'
        required: false
        default: ''

# Needed for release-please: write PRs, create tags/releases.
# packages: write is NOT included here — it is scoped to docker-publish-sign only.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      mcp_release_created: ${{ steps.release.outputs['packages/mcp-server--release_created'] }}
      mcp_tag_name: ${{ steps.release.outputs['packages/mcp-server--tag_name'] }}
      root_release_created: ${{ steps.release.outputs['--release_created'] }}
      root_tag_name: ${{ steps.release.outputs['--tag_name'] }}
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Use a PAT (RELEASE_PLEASE_TOKEN) so PRs opened by release-please trigger ci.yml.
          # GITHUB_TOKEN-driven actions cannot trigger workflows on other workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish-mcp:
    needs: release-please
    if: ${{ needs.release-please.outputs.mcp_release_created == 'true' || inputs.force_publish_tag != '' }}
    runs-on: ubuntu-latest
    environment: production-npm
    permissions:
      contents: read
      id-token: write  # npm provenance (OIDC) for signed publish on npm v9.5+
    defaults:
      run:
        working-directory: packages/mcp-server
    steps:
      - name: Validate tag shape
        # Runs before checkout: the job-default working-directory does not exist yet,
        # so this step must override it or bash fails to start.
        working-directory: .
        env:
          TAG: ${{ inputs.force_publish_tag || needs.release-please.outputs.mcp_tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^mcp-server-v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Tag '$TAG' does not match mcp-server-v<semver>"
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.force_publish_tag != '' && inputs.force_publish_tag || needs.release-please.outputs.mcp_tag_name }}

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # Pinned inline (not via .node-version) because publish-mcp checks out an old tag whose
          # source tree may predate .node-version. Node 24 ships with npm 11.x which already meets
          # Trusted Publishing's >= 11.5.1 requirement and avoids the `npm i -g npm@latest` bug.
          # Keep this in sync with .node-version manually.
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies (workspace root)
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: .
        run: pnpm --filter @kamiazya/whiteboard-mcp exec playwright install --with-deps chromium

      - name: Audit (publish gate)
        working-directory: .
        run: pnpm audit --prod --audit-level=high

      - name: Release candidate gate
        working-directory: .
        env:
          WHITEBOARD_DEV: '1'
        run: pnpm check:release-candidate

      - name: Unit tests
        working-directory: .
        run: pnpm test

      - name: Typecheck
        working-directory: .
        run: pnpm typecheck

      - name: Stdio E2E smoke (no quota required)
        working-directory: .
        env:
          WHITEBOARD_DEV: '1'
        run: pnpm smoke:e2e

      - name: Build
        run: pnpm build

      - name: Packaged stdio smoke
        working-directory: .
        run: pnpm smoke:packaged

      - name: Packed tarball smoke
        working-directory: .
        run: pnpm smoke:tarball

      - name: Codex config smoke
        working-directory: .
        run: pnpm smoke:codex-config

      - name: Template smoke
        working-directory: .
        run: pnpm smoke:template

      - name: Verify pack contents (README / LICENSE / no test / no .map only)
        # Sanity-check the tarball contents before publish. Fail immediately if required files are missing or forbidden files are included.
        run: |
          set -eu
          OUT=$(npm pack --dry-run --json)
          echo "$OUT" | node -e '
            let d=""; process.stdin.on("data",c=>d+=c); process.stdin.on("end",()=>{
              const j=JSON.parse(d)[0];
              const files = j.files.map(f=>f.path);
              const must = ["README.md", "LICENSE", "package.json", "dist/server/mcp/index.js"];
              const forbidden = [/\.test\.(js|d\.ts)$/, /\/_artifacts\//, /\.tsbuildinfo$/, /\.DS_Store$/];
              const missing = must.filter(p => !files.includes(p));
              const bad = files.filter(p => forbidden.some(rx => rx.test(p)));
              if (missing.length) { console.error("Missing required files:", missing); process.exit(1); }
              if (bad.length)     { console.error("Forbidden files in tarball:", bad); process.exit(1); }
              console.log(`Pack OK: ${files.length} files, ${(j.size/1024/1024).toFixed(1)} MB`);
            });
          '

      - name: Upload npm SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-sbom-${{ github.run_id }}
          path: packages/mcp-server/_artifacts/npm-sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish to npm
        # Assumes OIDC Trusted Publisher is configured (no NPM_TOKEN required).
        # `pnpm pack` first so the `catalog:` protocol in package.json is replaced
        # with concrete version ranges inside the tarball — npm itself cannot
        # resolve `catalog:` and would otherwise publish a broken manifest. npm
        # then publishes that pre-resolved tarball, preserving npm's OIDC Trusted
        # Publisher + provenance flow (pnpm publish does not perform the npm OIDC
        # token exchange, so we keep npm as the publisher).
        run: |
          set -eu
          TARBALL=$(pnpm pack | tail -1)
          npm publish "$TARBALL" --access public --provenance

  docker-publish-sign:
    needs: release-please
    if: ${{ needs.release-please.outputs.mcp_release_created == 'true' || inputs.force_publish_tag != '' }}
    runs-on: ubuntu-latest
    environment: production-docker
    permissions:
      contents: read
      id-token: write   # cosign keyless signing (OIDC)
      packages: write   # GHCR push
    steps:
      - name: Validate tag shape
        env:
          TAG: ${{ inputs.force_publish_tag || needs.release-please.outputs.mcp_tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^mcp-server-v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Tag '$TAG' does not match mcp-server-v<semver>"
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.force_publish_tag != '' && inputs.force_publish_tag || needs.release-please.outputs.mcp_tag_name }}

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @kamiazya/whiteboard-mcp exec playwright install --with-deps chromium

      - name: Release candidate gate (docker)
        env:
          WHITEBOARD_DEV: '1'
        run: pnpm check:release-candidate:docker

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.server
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ inputs.force_publish_tag || needs.release-please.outputs.mcp_tag_name }}
          sbom: true
          provenance: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the Docker image
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE_REPO: ghcr.io/${{ github.repository }}
        run: cosign sign --yes $IMAGE_REPO@$DIGEST

  deploy-web:
    needs: release-please
    runs-on: ubuntu-latest
    # Deploy apps/web to Cloudflare Pages when a project release is created.
    # Skipped when no release happened (e.g. mid-cycle pushes).
    # The Deploy step skips itself when Cloudflare secrets are not yet configured.
    # Secrets are scoped to the production-web environment (tag-protected in repo settings).
    # Requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the production-web environment.
    if: needs.release-please.outputs.releases_created == 'true'
    environment: production-web
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build apps/web
        run: pnpm --filter @kamiazya/whiteboard-web build

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          # pnpm is required: the npm fallback (`npm i wrangler@4`) cannot parse the
          # catalog: protocol in apps/web/package.json. wrangler ships as a devDependency
          # of apps/web so the action finds it preinstalled and skips installation.
          packageManager: pnpm
          command: pages deploy dist --project-name=kamiazya-whiteboard
