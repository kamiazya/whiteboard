# Weekly mutation testing for canvas-render, and it is a REPORT rather than a
# gate — the job stays green whatever the score, because a survivor is a
# hypothesis for a human to check, not a build failure.
#
# It exists because the per-diff gates cannot see this class of defect at all.
# A property that asserts nothing passes every run, every lint, every review
# that reads it as prose; two in this package were found that way by hand
# (a cache-hit branch no generated run reached, and a predicate whose false
# case one draw in a billion could produce), and both are exactly what a
# surviving mutant reports.
#
# NOT on pull_request, for two reasons: the run is measured in tens of
# minutes, and a score is a property of the whole suite rather than of one
# diff — gating a PR on it makes an unrelated author responsible for a gap
# somebody else left.
#
# ponytail: a full re-run every week. Stryker's `--incremental` cache would
# cut it to the changed files, and needs actions/cache plus a cache-key
# policy; worth doing when the run outgrows its timeout, not before.
name: Mutation

on:
  schedule:
    # Monday 04:23 UTC — off the hour, so it does not queue behind everything
    # else that runs at :00.
    - cron: '23 4 * * 1'
  workflow_dispatch:
  # A PR that changes the lane's own wiring runs the SMOKE step below. A
  # scheduled workflow is otherwise unverifiable until it is already on the
  # default branch — `workflow_dispatch` cannot reach a branch's copy — so
  # without this the first proof that the lane runs at all arrives a week
  # after it merges.
  pull_request:
    paths:
      - '.github/workflows/mutation.yml'
      - 'packages/canvas-render/stryker.config.mjs'
      - 'packages/canvas-render/vitest.stryker.config.ts'

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  canvas-render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mutation test canvas-render
        if: github.event_name != 'pull_request'
        run: pnpm mutation:render

      # What breaks about this lane is its WIRING, not its verdicts: the
      # plugin has to resolve out of a pnpm workspace, the tsconfig-rewriting
      # step has to stay skipped, and the vitest config has to load. One cheap
      # module exercises all three in about a minute, so a PR touching the
      # lane proves it still starts without paying for the full run.
      - name: Smoke the lane's wiring
        if: github.event_name == 'pull_request'
        run: >-
          pnpm --filter @kamiazya/whiteboard-canvas-render exec
          stryker run --mutate 'src/layout/nodes/truncate.ts'

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-canvas-render
          path: packages/canvas-render/tmp/stryker-reports/
          if-no-files-found: warn
          retention-days: 30
