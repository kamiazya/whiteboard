# Mutation testing for canvas-render, in two shapes, and REPORT-ONLY in both:
# neither job fails on a score, because a survivor is a hypothesis for a human
# to check rather than a build failure.
#
# It exists because the per-diff gates cannot see this class of defect at all.
# A property that asserts nothing passes every run, every lint, and every
# review that reads it as prose; two in this package were found that way by
# hand (a cache-hit branch no generated run reached, and a predicate whose
# false case one draw in a billion could produce), and both are exactly what a
# surviving mutant reports.
#
#   pr      — mutates only the curated files THIS DIFF changed, and posts the
#             survivors as a sticky comment. Most diffs touch none of them and
#             the job exits in under a minute having said nothing.
#   weekly  — the whole curated list, uploaded as an artifact.
#
# The PR half is not a nicety. A weekly artifact is a number nobody opens, and
# a lane whose findings nobody reads is the same as no lane: this repo's own
# history has a prose rule decaying until a hook made it mechanical. Scoping
# the PR run to the diff also settles the fairness objection to gating on a
# score — you are shown your own files, not somebody else's debt.
name: Mutation

on:
  schedule:
    # Monday 04:23 UTC — off the hour, so it does not queue behind everything
    # else that runs at :00.
    - cron: '23 4 * * 1'
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # measured: 2026-10-02 40 min
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The diff is the input, so the base branch has to be reachable.
          fetch-depth: 0
          # This job runs untrusted PR code — an install and a mutation run —
          # so don't leave the git credential where that tooling can read it.
          # Nothing here needs authenticated git: the diff reads objects that
          # are already fetched, and the comment step authenticates with
          # GH_TOKEN instead.
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - name: Scope the run to the curated files this diff changed
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # THREE dots: the merge base, not the base branch's tip. `base.sha` is
          # where the base branch stood when the PR opened, so a two-dot range
          # grows every time the base moves ahead — and everything that landed
          # on it in between reads as a file this PR changed. Measured on
          # #1293, which touched apps/web and docs only: two-dot reported six
          # curated files and three-dot reported none, and the lane attributed
          # ten survivors to a PR that never opened that file.
          git diff --name-only "$BASE"..."$HEAD" > /tmp/changed.txt
          scoped=$(node .claude/scripts/mutation-scope.mjs \
            --targets ./packages/canvas-render/stryker-targets.mjs \
            --prefix packages/canvas-render/ \
            --changed-from /tmp/changed.txt)
          echo "files=$scoped" >> "$GITHUB_OUTPUT"
          if [ -z "$scoped" ]; then
            echo "No curated canvas-render module changed — nothing to mutate."
          else
            echo "Mutating: $scoped"
          fi

      # Only once there is something to mutate: the scoping step reads a plain
      # list module, so a PR that reaches none of the lane's files finishes
      # without an install at all.
      - name: Install dependencies
        if: steps.scope.outputs.files != ''
        run: pnpm install --frozen-lockfile

      - name: Mutate the changed files
        if: steps.scope.outputs.files != ''
        working-directory: packages/canvas-render
        run: pnpm exec stryker run --mutate "${{ steps.scope.outputs.files }}"

      - name: Render the comment
        id: comment
        if: steps.scope.outputs.files != ''
        run: |
          set -euo pipefail
          node .claude/scripts/mutation-comment.mjs \
            packages/canvas-render/tmp/stryker-reports/mutation.json \
            --marker '<!-- canvas-render-mutation -->' \
            --equivalents packages/canvas-render/stryker-targets.mjs > /tmp/mutation-comment.md
          if [ -s /tmp/mutation-comment.md ]; then echo "has=1" >> "$GITHUB_OUTPUT"; fi

      # Same sticky shape as the preview-URL comment: one comment per PR,
      # edited in place, so a ten-push branch does not grow ten of them.
      # Skipped from a fork, where the token is read-only by design.
      - name: Comment the survivors on the PR
        if: >-
          steps.comment.outputs.has == '1' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          MARKER='<!-- canvas-render-mutation -->'
          CID=$(gh api "repos/$REPO/issues/$PR/comments" \
            --jq "[.[] | select(.body | contains(\"$MARKER\"))][0].id // empty")
          if [ -n "$CID" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$CID" \
              -F body=@/tmp/mutation-comment.md >/dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" \
              -F body=@/tmp/mutation-comment.md >/dev/null
          fi

      - name: Upload mutation report
        if: always() && steps.scope.outputs.files != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-canvas-render-pr
          path: packages/canvas-render/tmp/stryker-reports/
          if-no-files-found: warn
          retention-days: 14

  # One leg per share of the curated list (`MUTATION_SHARD`, dealt by
  # `shardOf` in stryker-targets.mjs): the whole list no longer fits one
  # runner's limit, and a cancelled run uploads nothing, because the reports
  # are written at the end. A report-only lane going quiet looks the same as a
  # lane with nothing to say, so each leg must finish well inside its limit.
  #
  # Sizing. The last whole-lane run to finish took 95 minutes (2026-09-07); the
  # next three were cancelled at 180, so 180 is a lower bound on the whole
  # lane. The heaviest of six legs holds 836 of the 3451 mutants (24%), which
  # makes 44 minutes its share of that bound, and the limit is 2x it for
  # install time and for the lane's growth. `perTest` coverage (see
  # stryker.config.mjs) takes about a quarter off that on top. Replace the
  # `measured:` figure with the longest leg of the next scheduled run, and
  # re-count the heaviest leg's share when MUTATED changes. The guard in
  # tools/arch-lint/src/mutation-lane.test.ts holds the figure to 1.5x
  # headroom.
  weekly:
    if: github.event_name != 'pull_request'
    name: weekly (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # measured: 2026-09-28 44 min
    timeout-minutes: 90
    strategy:
      # A leg that times out must not cancel the others: the reports of the
      # legs that finished are the point.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same reason as the PR job: this one performs no authenticated git
          # operation either, so keep the job token away from build tooling.
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mutation test canvas-render
        env:
          MUTATION_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: pnpm mutation:render

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-canvas-render-shard-${{ matrix.shard }}
          path: packages/canvas-render/tmp/stryker-reports/
          if-no-files-found: warn
          retention-days: 30

  # One report out of the legs', under the name the single-job lane used, so
  # anything that looked for `mutation-canvas-render` still finds it. Runs
  # after a failed or cancelled leg too, and merges what finished: the files a
  # leg did not reach are absent from the report rather than the whole week.
  weekly-report:
    if: github.event_name != 'pull_request' && !cancelled()
    needs: weekly
    runs-on: ubuntu-latest
    # measured: 2026-10-03 1 min
    # Two jq calls over the downloaded reports (0.04 s locally over two real
    # ones); the download and upload are the rest, and are not yet observed.
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-canvas-render-shard-*
          path: shards

      - name: Merge the legs' reports
        run: |
          set -euo pipefail
          if ! compgen -G 'shards/*/mutation.json' > /dev/null; then
            echo '::error::no leg produced a mutation report'
            exit 1
          fi
          mkdir -p report
          # Each leg mutates a disjoint set of files, so concatenating the
          # `files` maps is the whole merge; the other top-level keys are the
          # same in every leg.
          jq -s '.[0] + {
            files: (map(.files) | add),
            testFiles: (map(.testFiles // {}) | add)
          }' shards/*/mutation.json > report/mutation.json
          echo "merged $(jq '.files | length' report/mutation.json) files from $(ls -d shards/*/ | wc -l) legs"

      - name: Upload merged mutation report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-canvas-render
          path: report/
          retention-days: 30
