# Every fuzz target of crates/fuzz, long, under AddressSanitizer, on a
# SCHEDULE (QR-29d, QR-28f): the PR run (`pnpm rust:fuzz:pr`, in ci.yml's rust
# job) gives each changed entry tens of seconds, which finds the shallow
# crashes; the corpus only grows deep enough to find the rest when something
# runs it for minutes every day and keeps what it found.
#
# The corpus lives in the Actions cache, never in git: restored from the last
# run, grown, minimised by `cargo fuzz cmin`, and saved under a new key. Only
# the inputs that crashed are committed, by hand, as regressions
# (crates/fuzz/regressions/), after minimising.
#
# A finding fails the run, which notifies the repository owner through
# GitHub's default; the crashing inputs are uploaded as an artifact so the
# fix can start from the exact bytes. File the finding as a whiteboard issue.
name: rust-fuzz-nightly

on:
  schedule:
    # Daily, offset off the hour (GitHub queues on-the-hour crons behind
    # everyone else's).
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-fuzz-nightly
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      RUST_FUZZ_SECONDS: '600'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version

      - name: Pinned nightly toolchain (crates/fuzz/rust-toolchain.toml)
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' crates/fuzz/rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component llvm-tools --component rust-src

      # The build directory too: `--careful` rebuilds std under ASan, which
      # measured 6 min 21 s cold on a 4-core machine.
      - name: Restore the corpus, the fuzz build and the cargo-fuzz install
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            crates/fuzz/corpus
            crates/fuzz/target
            ~/.cargo/bin/cargo-fuzz
          key: rust-fuzz-corpus-${{ github.run_id }}
          restore-keys: rust-fuzz-corpus-

      - name: cargo-fuzz
        run: cargo fuzz --version || cargo install --locked cargo-fuzz --version 0.13.2

      - name: Fuzz every target (ASan, careful std), minimise the corpus, report coverage
        run: node tools/checks/src/rust-fuzz.mjs nightly --coverage

      - name: Report
        if: always()
        run: |
          {
            echo '## Rust fuzz (nightly)'
            echo '```json'
            cat crates/fuzz/artifacts/report.json 2>/dev/null || echo '{"report": "none written"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-fuzz-findings
          path: |
            crates/fuzz/artifacts
            crates/fuzz/regressions
          retention-days: 30
