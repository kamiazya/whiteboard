# Cloudflare Pages "latest" preview alias, tracking main (separate from the
# tag-gated production deploy in release.yml). Deploys to
# https://latest.kamiazya-whiteboard.pages.dev — `--branch=latest` is never the
# production branch, so it never touches the production URL.
#
# Even on TRUSTED refs (push to main / manual dispatch) the build is split from
# the deploy: `build-latest` installs and builds apps/web — dependency code — with
# no secret, and `deploy-latest` holds the Cloudflare token and runs none of it. A
# secret scoped to one step is no boundary inside one job, since an earlier build
# could rewrite the wrangler the deploy step runs. Untrusted PR previews are split
# the same way across preview-pr-build.yml and preview-pr-deploy.yml.
name: Deploy Preview

on:
  push:
    branches: [main]
  # Manual trigger to (re)deploy the latest alias — e.g. to verify preview-web
  # secrets or re-publish main on demand.
  workflow_dispatch:

concurrency:
  group: preview-latest
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-latest:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      site_sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          # A cold store: this job's output is published, and the store cache is
          # written by default-branch jobs that run every dev and test dependency.
          cache-store: 'false'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build apps/web
        run: pnpm --filter @kamiazya/whiteboard-web build
      - name: Archive the built site
        id: archive
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/web-site"
          tar -C apps/web/dist -cf "$RUNNER_TEMP/web-site/site.tar" .
          echo "sha256=$(sha256sum "$RUNNER_TEMP/web-site/site.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload the site for deploy-latest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-site-${{ github.run_id }}
          path: ${{ runner.temp }}/web-site/site.tar
          if-no-files-found: error
          retention-days: 3

  deploy-latest:
    needs: build-latest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    environment:
      name: preview-web
      # Surfaces the real alias in the Environments UI ("View deployment").
      url: https://latest.kamiazya-whiteboard.pages.dev
    # Runs no repository or dependency code: the deploy tooling's own lockfile
    # supplies wrangler, installed with lifecycle scripts off, and the site is
    # the one build-latest archived, checked against its digest.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/deploy
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the pinned wrangler (lockfile, no lifecycle scripts)
        id: tooling
        working-directory: .github/deploy
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          echo "wrangler=$(jq -r '.packages["node_modules/wrangler"].version' package-lock.json)" >> "$GITHUB_OUTPUT"
      - name: Download the site build-latest archived
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-site-${{ github.run_id }}
          path: artifacts/web-site
      - name: Verify the site against build-latest's digest, then unpack it
        env:
          SITE_SHA256: ${{ needs.build-latest.outputs.site_sha256 }}
        run: |
          set -euo pipefail
          cd artifacts/web-site
          echo "$SITE_SHA256  site.tar" | sha256sum -c -
          mkdir dist
          tar -xf site.tar -C dist --no-same-owner
      - name: Check for the Cloudflare secrets
        id: cf
        # `secrets` cannot be read in a step `if:`, so presence is answered
        # here as a boolean — the values themselves never enter this step.
        env:
          READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: echo "ready=$READY" >> "$GITHUB_OUTPUT"
      - name: Deploy latest preview
        # Self-skips until the preview-web secrets exist.
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The wrangler installed above; the exact version keeps the action
          # from running an install of its own.
          workingDirectory: .github/deploy
          packageManager: npm
          wranglerVersion: ${{ steps.tooling.outputs.wrangler }}
          command: pages deploy ../../artifacts/web-site/dist --project-name=kamiazya-whiteboard --branch=latest
