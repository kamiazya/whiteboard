# cargo-mutants' configuration, and the ledger of mutants the gate does not
# judge (QR-17). Every `exclude_re` entry carries its reason in the comment
# directly above it; `tools/checks/src/rust-mutants.mjs` fails an entry with
# no reason, an entry that no longer matches any mutant (a stale one), and a
# change in how many entries there are, which it pins.
#
# An entry is for a mutant no test can observe, never for one a test is owed:
# a survivor is classified first (real risk: add the test; equivalent or
# intentionally permissive: ledger it here with the reason).

exclude_re = [
  # The xtask entry point: argument dispatch and exit-code mapping. Every arm
  # runs in `pnpm rust:check` (and the release check), whose steps fail when
  # a task does not run; a unit test would re-state the match.
  '^crates/xtask/src/main\.rs:',
  # `cargo xtask coverage`'s process and file plumbing around the tested
  # `check` and `required_version`: spawning cargo llvm-cov and writing the
  # ledger back. Judged by running it in `pnpm rust:check`.
  '^crates/xtask/src/coverage\.rs:\d+:\d+: (replace (measure|run) -> |.* in (measure|run)$)',
  # `cargo xtask dist`'s process plumbing: `build` spawns cargo, `bindgen`
  # wasm-bindgen, and `run_task` loads the metadata and calls them. Their
  # decisions (the arguments, the oracle feature, the directory) are the
  # tested `parse_args`, `default_dir_for` and `wasm_build_args`; the rest is
  # judged by running `dist` in CI's rust job and `repro-check`.
  '^crates/xtask/src/dist\.rs:\d+:\d+: replace (build|bindgen|run_task) -> ',
  # config_score: `j` is filtered to `j != i` before these comparisons, so
  # `i <= j` is `i < j` (both `<` in apply_pair_costs and the one in
  # contribution).
  'config_score\.rs:\d+:\d+: replace < with <= in ConfigScore<.a>::contribution$',
  # config_score: as above, for apply_pair_costs' two `<`.
  'config_score\.rs:\d+:\d+: replace < with <= in ConfigScore<.a>::apply_pair_costs$',
  # config_score: `updates.has(key)` already implies `touched(j) && j < i`, so
  # the skip's `A || X` is X and `A && X` is A; they differ only on a revisit
  # that recorded no update, which never calls pair_score and spends nothing.
  'config_score\.rs:\d+:\d+: replace \|\| with && in ConfigScore<.a>::apply_pair_costs$',
  # config_score: `j == i` never holds past the filter, so `j == i` reduces the
  # skip to `updates.has(key)`, the case above. Column-pinned: the other `<`
  # in this function is judged.
  'config_score\.rs:\d+:68: replace < with == in ConfigScore<.a>::apply_pair_costs$',
  # coincident_ends: the tier and bend comparisons sit inside `!=` guards, so
  # `<=` is `<` (NaN makes both false). Column-pinned: the length comparison's
  # `<=` is judged.
  'coincident_ends\.rs:\d+:(23|24): replace < with <= in better_repair$',
  # straight_detour: only the leg cache's KEY order changes, and first_blocker
  # is symmetric in its endpoints (no asymmetry in 3M boundary-biased probes,
  # no output diff on 9000 fuzzed boards); `<=` differs only at u == v, which
  # a settled vertex never reaches.
  'straight_detour\.rs:\d+:28: replace < with (==|>|<=) in corner_detour$',
  # straight_detour: the bounding-box pre-filter is redundant with the same
  # rejection inside segment_crosses_rect. Column-pinned: the escaping test's
  # `||` is judged.
  'straight_detour\.rs:\d+:13: replace \|\| with && in first_blocker$',
  # straight_detour: `p == 0` has already taken the `continue`, so `p <= 0` is
  # `p < 0`.
  'straight_detour\.rs:\d+:\d+: replace < with <= in enters_interior$',
  # straight_detour: one component of the outward normal is always zero, so
  # `abs(x - 0)` is `abs(x + 0)`. Column-pinned: the vx/vy minuses are judged.
  'straight_detour\.rs:\d+:37: replace - with \+ in approaches_sideways$',
  # straight_detour: always answering vertex 0 makes the corner search loop
  # forever on any blocked route, so the mutant times out (measured past 120s)
  # rather than surviving; every detour test hangs on it.
  'straight_detour\.rs:\d+:\d+: replace nearest_open -> Option<usize> with Some\(0\)$',
  # segment_intersection: a `t` that passes the range test leaves x and y both
  # finite or both NaN, never one alone. LINE-pinned, because 30:29 has the
  # same description and is judged; an edit above it makes this entry stale,
  # which the gate reports rather than hiding.
  'segment_intersection\.rs:34:29: replace \|\| with && in segment_intersection$',
  # spatial_edges: every OR in the Morton interleave joins operands with
  # disjoint bits, so `|` is `^`.
  'spatial_edges\.rs:\d+:\d+: replace \| with \^ in interleave$',
  # spatial_edges: gx sits on bits 3k and gy << 1 on bits 3k+1, so `|` is `^`.
  'spatial_edges\.rs:\d+:\d+: replace \| with \^ in morton_keys$',
  # spatial_edges: the cell index never exceeds GRID - 1 (the value lies in
  # [min, min + span]), so a cap of GRID + 1 or GRID binds nowhere.
  # Column-pinned: the same descriptions at other columns are judged.
  'spatial_edges\.rs:\d+:29: replace - with [+/] in morton_keys$',
  # spatial_edges: n = 0 means no edges, so the search prices nothing and the
  # anchors and the budget come back the same (measured).
  'spatial_edges\.rs:\d+:\d+: replace match guard n >= 1 with true in assign_edge_anchors$',
  # spatial_edges: the sort comparator is only ever called with the later
  # index first, so the index tie-break's `Less` arm is never reached.
  # Column-pinned: the same description at column 13 is judged.
  'spatial_edges\.rs:\d+:45: delete - in trial_edges_for$',
  # edge_crossing_sweep: `denom == 0` (which also matches -0) has already
  # returned, so `denom <= 0` is `denom < 0`. Column-pinned: the same
  # description at another column is judged.
  'edge_crossing_sweep\.rs:\d+:14: replace < with <= in score_quantized_segment_pair$',
  # edge_crossing_sweep: a pair of the same edge has already been skipped, so
  # `<=` on the edge index is `<`. Column-pinned: the bounding-box `<` is judged.
  'edge_crossing_sweep\.rs:\d+:38: replace < with <= in score_against_active$',
  # edge_anchors: `dir == 0` (and -0) has already returned and NaN fails both,
  # so `dir >= 0` is `dir > 0`. Column-pinned: the same description at another
  # column is judged.
  'edge_anchors\.rs:\d+:12: replace > with >= in sweep_rank$',
  # edge_anchors: `lo <= hi` in the binary search either loops forever or
  # returns len + 1 where the answer is len, which both callers read the same
  # way, so the mutant times out (measured past 60s) rather than surviving.
  'edge_anchors\.rs:\d+:\d+: replace < with <= in first_index_where$',
  # grid_route: the only NaN that reaches `distinct` is an endpoint's own
  # coordinate (obstacle lines fail in_x/in_y), and index_of never finds it,
  # so route_on_grid answers no path with nothing spent whatever the set holds.
  'grid_route\.rs:\d+:\d+: replace && with \|\| in distinct$',
  # edge_contact: equal centres have already returned and NaN fails both, so
  # `>=` is `>`.
  'edge_contact\.rs:\d+:\d+: replace > with >= in contact_along$',
  # edge_geometry: a segment parallel to an axis has already been rejected by
  # the bounding-box test on exactly these two conditions. Column-pinned: the
  # pre-filter's own `||` mutants are judged.
  'edge_geometry\.rs:\d+:27: replace \|\| with && in segment_crosses_rect$',
  # edge_geometry: every slab step returns on `enter >= exit`, and two
  # degenerate axes leave 0 < 1, so the final `>=` is `>`. Column-pinned.
  'edge_geometry\.rs:\d+:10: replace > with >= in segment_crosses_rect$',
  # edge_ink: the only caller skips dx == 0 and dy == 0, so p is never zero
  # and `<=` is `<`.
  'edge_ink\.rs:\d+:\d+: replace < with <= in inside_fraction$',
  # edge_ink: t0 and t1 can tie only at a finite value, where t1 - t0 is +0,
  # the same bits as the 0.0 arm.
  'edge_ink\.rs:\d+:\d+: replace > with >= in inside_fraction$',
  # edge_rules: `find` has already kept only x != y, so `x <= y` is `x < y`
  # (NaN makes both false).
  'edge_rules\.rs:\d+:\d+: replace < with <= in less_cost$',
  # edge_router: the comparator's `>` against the 1e-6 length tolerance
  # differs from `>=` only when two candidate lengths differ by exactly that
  # f64, which needs both below about 3e-6 px; no candidate kind is that short
  # (elbows tie, detours are at least 32 px). Believed equivalent, not proven.
  'edge_router\.rs:\d+:\d+: replace > with >= in best_candidate$',
  # grid_route: a traced border costing -1 makes a negative cycle on a grid
  # whose lines sit under a pixel apart, and the search then never ends. The
  # workspace run reaches such a board before survivors_grid_route.rs, which
  # kills the mutant in about a second, so it times out rather than surviving.
  'grid_route\.rs:\d+:\d+: replace traced_along -> f64 with -1\.0$',
  # js_map: index values are distinct positions, so once key i is removed no
  # remaining slot equals i, and `>` and `>=` pick the same slots.
  'js_map\.rs:\d+:\d+: replace > with >= in JsMap<K, V>::delete$',
  # min_heap: these are the `left < len` / `right < len` bounds; at the bound
  # cost() answers NaN, and `NaN < x` is false, so `smallest` never moves.
  # Column-pinned: the cost comparisons share the description and are judged.
  'min_heap\.rs:\d+:25: replace < with <= in MinHeap::pop$',
  # min_heap: the `right < len` bound, as above.
  'min_heap\.rs:\d+:26: replace < with <= in MinHeap::pop$',
  # min_heap: both make the sift loop forever (indices 2 and 3 each other's
  # child; a self-swap when smallest == parent), so every search hangs: the
  # mutant's own infinite loop, a timeout rather than a survivor.
  'min_heap\.rs:\d+:\d+: replace \* with / in MinHeap::pop$',
  # min_heap: a self-swap when smallest == parent, which a one-element heap
  # reaches on the first pop: the sift never ends, a timeout.
  'min_heap\.rs:\d+:\d+: replace == with != in MinHeap::pop$',
  # grid_route: an empty heap's `pop()?` already returns None, the loop's own
  # exit value. Column-pinned: the same description at another column is judged.
  'grid_route\.rs:\d+:22: replace > with >= in search_grid$',
  # grid_route, timeouts. Each of these is killed in about a second by
  # survivors_grid_route.rs, whose boards charge every step against a finite
  # allowance. The gate runs the lib unit tests and crossing_sweep_properties
  # first, whose searches charge nothing on an open grid, and on those the
  # mutant's own loop never ends, so it times out instead. This one: a negative
  # traced cost makes a negative cycle (crossing_sweep_properties hangs).
  'grid_route\.rs:\d+:\d+: replace > with < in traced_along$',
  # grid_route timeout: no coordinates make every step cost NaN, which never
  # compares settled, so states re-relax forever (lib steps_around_a_box hangs).
  'grid_route\.rs:\d+:\d+: replace GridSearch::coords -> &\[f64\] with Vec::leak\(Vec::new\(\)\)$',
  # grid_route timeout: one coordinate, the same NaN re-relaxing.
  'grid_route\.rs:\d+:\d+: replace GridSearch::coords -> &\[f64\] with Vec::leak\(vec!\[0\.0\]\)$',
  # grid_route timeout: one coordinate, the same NaN re-relaxing.
  'grid_route\.rs:\d+:\d+: replace GridSearch::coords -> &\[f64\] with Vec::leak\(vec!\[1\.0\]\)$',
  # grid_route timeout: one coordinate, the same NaN re-relaxing.
  'grid_route\.rs:\d+:\d+: replace GridSearch::coords -> &\[f64\] with Vec::leak\(vec!\[-1\.0\]\)$',
  # grid_route timeout: states land out of range and are re-pushed uncharged
  # (lib runs_straight hangs). Column-pinned: 219:30 is judged.
  'grid_route\.rs:\d+:12: replace \* with \+ in GridSearch::state_of$',
  # grid_route timeout: every pop decodes to one cell, so the search loops.
  'grid_route\.rs:\d+:\d+: replace GridSearch::cell_of -> \(usize, usize\) with \(0, 1\)$',
  # grid_route timeout: every pop decodes to one cell, so the search loops.
  'grid_route\.rs:\d+:\d+: replace GridSearch::cell_of -> \(usize, usize\) with \(1, 1\)$',
  # grid_route timeout: states decode off the grid and re-push forever.
  # Column-pinned: the other `/` in cell_of is judged.
  'grid_route\.rs:\d+:26: replace / with \* in GridSearch::cell_of$',
  # grid_route timeout: j decodes as i, so states re-push forever.
  # Column-pinned: the other `/` in cell_of is judged.
  'grid_route\.rs:\d+:34: replace / with % in GridSearch::cell_of$',
  # grid_route timeout: off-grid steps get NaN costs and re-relax forever.
  'grid_route\.rs:\d+:\d+: replace \|\| with && in expand$',
  # grid_route timeout: subtracting the step length makes a negative cycle.
  # Column-pinned: the other `+` in expand are judged.
  'grid_route\.rs:\d+:34: replace \+ with - in expand$',
  # grid_route timeout: `hi + lo` is negative on negative coordinates, a
  # negative cycle (crossing_sweep_properties hangs).
  'grid_route\.rs:\d+:\d+: replace - with \+ in expand$',
  # grid_route timeout: `hi / lo` gives negative or NaN costs, and the search
  # loops.
  'grid_route\.rs:\d+:\d+: replace - with / in expand$',
  # grid_route timeout: the y bound turned `<` lets every in-range step off the
  # grid, and lib runs_straight_when_nothing_is_in_the_way then never settles;
  # survivors_grid_route.rs kills it in under a second. Column-pinned: the x
  # bound's mutant is judged.
  'grid_route\.rs:\d+:35: replace >= with < in expand$',
  # codec cursor: a mutant that stops `eof`, `bump`, `skip` or
  # `skip_to_line_end` from doing their one job leaves every loop over the
  # cursor with nothing to end it, so the parse of any text hangs and the
  # timeout is the only detection.
  'cursor\.rs:\d+:\d+: replace Parser::(eof|bump|skip|skip_to_line_end)( -> bool)? with (true|false|\(\))$',
  # codec cursor: `blank_at` answering false is the same hang on any text a
  # scan stops at a blank in. frontmatter_examples.rs fails it in seconds,
  # but the property, oracle replay and fuzz seed replay in the same
  # workspace run never end, so the gate sees a timeout. Its `true` sibling
  # is judged.
  'cursor\.rs:\d+:\d+: replace Parser::blank_at -> bool with false$',
  # codec cursor: the operators inside the same primitives (the end test,
  # the space scan, the line-end scan, the alias name scan) turn a loop that
  # advances to one that never ends; any text with a space, a line or an
  # alias hangs. Column-pinned to those loops.
  'cursor\.rs:\d+:(18|26|27|15|41|33): (replace|delete) .* in Parser::(eof|skip_spaces|skip_to_line_end|alias)$',
  # codec props and verbatim_tag: the name scan's `&&` turned `||` never
  # meets its stop, so any property hangs.
  'block\.rs:\d+:(37|33): replace && with \|\| in Parser::(props|verbatim_tag)$',
  # codec keep_more_indented: the scan's guards turned over never advance
  # the position, so any folded block scalar hangs.
  'block_string\.rs:\d+:(27|32): replace (&&|==) with (\|\||!=) in keep_more_indented$',
  # codec block scalar scans (indent detection and the trailing-line trim):
  # a guard turned over never advances or never stops, so any block scalar
  # hangs.
  'blockscalar\.rs:\d+:(38|29|33): replace (==|&&) with (!=|\|\|) in Parser::(block_indent|block_lines)$',
  # codec fold: the scan's primitive (the unit at an index) and the more-
  # indented-line walk answered wrongly never leave the loop that reads
  # them, so folding any long scalar hangs.
  'fold\.rs:\d+:\d+: replace (at -> u16 with 1|more_indented_end -> isize with (0|1|-1))$',
  # codec fold: the operators of the more-indented-line walk, turned over,
  # loop forever on any block scalar that folds. Column-pinned to the walk.
  'fold\.rs:\d+:(16|33|30): replace (==|\|\|) with (!=|&&) in more_indented_end$',
  # codec Decimal::mul_add: the carry loop's `> 0` turned `==` or `>=`, and
  # `/= 10` turned `%= 10`, never reaches a zero carry, so any integer past
  # 2^53 hangs.
  'number\.rs:\d+:(21|19): replace (> with (==|>=)|/= with %=) in Decimal::mul_add$',
  # codec plain and quoted scalar scans: the line walk and the continuation
  # walk answered with a fixed position, or with an operator turned over,
  # never reach the end of the scalar, so any multi-line scalar hangs.
  'scalars\.rs:\d+:\d+: replace (\|\| with && in Parser::plain_line|Parser::blanks_into -> Option<Stop> with None|Parser::next_continuation -> Option<\(usize, usize\)> with Some\(\(\d, \d\)\)|== with != in Parser::(next_continuation|fold_into))$',
  # codec explicit_key: a `?` with no key on its line is refused whatever is
  # read after it, so `eof || column` read as `eof && column` only changes
  # which node the discarded key is.
  'block\.rs:\d+:37: replace \|\| with && in Parser::explicit_key$',
  # codec fold_block: a trailing line of exactly the trim width holds no
  # indentation to keep, so counting it as content (`>=`) writes the same
  # text as not counting it.
  'blockscalar\.rs:\d+:\d+: replace > with >= in fold_block$',
  # codec radix_to_f64: the length guard only spares a long literal the
  # digit-by-digit conversion; at exactly its bound the literal is past the
  # largest double, so `parse` answers infinity either way.
  'number\.rs:\d+:47: replace > with (==|>=) in radix_to_f64$',
  # codec json_canvas reader: a cursor that never advances leaves every loop
  # over the text with nothing to end it, so the parse of any text hangs and
  # the timeout is the only detection.
  'json\.rs:\d+:\d+: replace Reader<.+>::bump with \(\)$',
  # canvas-render line_width: the weight an edge's heads scale by. A width of
  # exactly 0 read as usable (`>=`) answers 0 where 1 was answered, and the head
  # scale is `max(1, width * 3.2 / 8)`, which is 1 for both, and every inset
  # reads the scale first.
  'edge_arrows\.rs:\d+:\d+: replace > with >= in line_width$',
  # canvas-render clip_to_convex: `sign` is plus or minus one, so the inward
  # normal's `* sign` and `/ sign` are the same number.
  'sketch_shape\.rs:\d+:\d+: replace \* with / in clip_to_convex$',
  # canvas-render clip_to_convex: the branch for a hatch line parallel to an
  # edge (`denominator == 0`). The line's direction is the cosine and sine of a
  # seeded angle and is never exactly parallel to an outline's edge, so no seed
  # reaches the branch, so its comparison cannot be told from its neighbours.
  # Column-pinned.
  'sketch_shape\.rs:\d+:26: replace < with (==|>|<=) in clip_to_convex$',
  # canvas-render clip_to_convex: the strict `>` that picks entry or exit after
  # the parallel branch; with that branch unreachable the denominator is never
  # zero, so `>` and `>=` pick the same side. Column-pinned.
  'sketch_shape\.rs:\d+:24: replace > with >= in clip_to_convex$',
  # canvas-render clip_to_convex: an entry past the exit ends the walk, and an
  # entry equal to the exit leaves a chord of no length, which the final length
  # check refuses the same way, so `>=` and `==` end the same hatch line.
  'sketch_shape\.rs:\d+:20: replace > with (==|>=) in clip_to_convex$',
  # canvas-render clip_to_convex: exactly one of entry and exit left infinite
  # can only come from an outline with no bounding edge, which no outline the
  # sweeps draw is (a polygon of fewer than three points leaves both infinite).
  # Column-pinned.
  'sketch_shape\.rs:\d+:29: replace \|\| with && in clip_to_convex$',
  # canvas-render clip_to_convex: a chord of length exactly 1 is a chance in a
  # float that no seed reaches, and `<=` refuses only that one. Column-pinned.
  'sketch_shape\.rs:\d+:72: replace < with <= in clip_to_convex$',
  # canvas-render clipped_area: a region touching the drawn box along an edge
  # has an overlap of zero on that axis, and `0 * other` is 0 whether the zero
  # is counted (`>=`) or not.
  'filter_budget\.rs:\d+:\d+: replace > with >= in clipped_area$',
  # canvas-render pulled_back: an end with an inset of exactly 0 is moved by
  # `0 * direction`, which is the point where it was.
  'render_edge\.rs:\d+:\d+: replace > with >= in pulled_back$',
  # canvas-render halo_underlay: the pill's pad is the constant 2, and
  # `2 * pad` and `2 + pad` are both 4.
  'runs\.rs:\d+:\d+: replace \* with \+ in halo_underlay$',
  # canvas-render truncate: `may_cluster` only chooses how a text is walked.
  # Answering true for text that holds no cluster sends it down the grapheme
  # segmenter, which cuts it at the same code points (714,056 strings below
  # U+0300 agree, measured in the TypeScript this ports), so the answer is the
  # same and only the cost differs.
  'truncate\.rs:\d+:\d+: replace may_cluster -> bool with true$',
  # canvas-render truncate: `c != '\r'` is true of every character but CR, and
  # a text of CRs alone holds no cluster, so it is the same eager-only change
  # as above.
  'truncate\.rs:\d+:\d+: replace == with != in may_cluster$',
  # canvas-render scene_digest plan: with a NaN height the TypeScript allocates
  # `new Int32Array(cols)` and throws past 2^53 - 1, the bound `>` names. At
  # exactly 2^53 - 1 cells the buffer is 32 PiB, which no engine allocates, so the
  # TypeScript throws there too and `>=` answers the same.
  'free_regions\.rs:\d+:\d+: replace > with >= in plan$',
]
