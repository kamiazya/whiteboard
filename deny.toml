# Supply-chain gate for the Rust workspace, run as `cargo deny check`.
# The license allowlist is what the project's own license (Apache-2.0) can
# carry and redistribute in the published npm binaries; add a license only
# with the crate that needs it named beside it.

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails, unmaintained and unsound included; an
# accepted one goes in `ignore` with the reason it does not reach us.
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  # unicode-ident's data tables.
  "Unicode-3.0",
  # foldhash, through wasmparser's indexmap (xtask only, never shipped).
  "Zlib",
]
# libFuzzer's own sources, which libfuzzer-sys compiles into the nightly-only
# fuzz targets; never shipped.
exceptions = [{ crate = "libfuzzer-sys", allow = ["NCSA"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A `path` dependency between this repository's own crates carries no
# version; cargo-deny accepts that only for unpublished crates, which every
# crate here is (`publish = false`). Registry dependencies stay version-pinned.
allow-wildcard-paths = true
# Crates that reach the OS or a runtime, allowed only as a DIRECT dependency
# of the bindings or mechanics crates named in `wrappers` (cargo-deny's
# meaning: permitted when every crate pulling it in is a wrapper). The
# wrappers are the planned crates of crates/architecture-map.json; a core
# crate that pulls one in, at any depth, fails here before it fails anywhere
# else.
deny = [
  # wasm-bindgen-futures names tokio only for emscripten under the unstable
  # `wasm_bindgen_unstable_tokio` cfg, so it is resolved in the lockfile and
  # built for no target here; it arrives with wasm-bindgen-test, a wasm32
  # dev-dependency of the core crates (QR-21 layer 3).
  { crate = "tokio", wrappers = ["whiteboard-daemon", "wasm-bindgen-futures"], reason = "an async runtime belongs to the native composition root" },
  { crate = "hyper", wrappers = ["whiteboard-daemon"], reason = "the HTTP server belongs to the native composition root" },
  { crate = "rusqlite", wrappers = ["whiteboard-daemon-store"], reason = "SQLite is the daemon store's mechanic" },
  # jobserver is `cc`'s build-time client of make's job server: its
  # randomness names a temporary FIFO while a C dependency compiles, and never
  # reaches a built artifact (libfuzzer-sys's build is where it appears).
  # A property's runner is the one other place OS randomness belongs: QR-14d
  # forbids a pinned seed, so each run draws a fresh one. It arrives only
  # through the prelude, which is a dev-dependency (arch-map refuses it as a
  # normal one, since no crate lists it in allowedInternalDeps), so it never
  # reaches a built artifact.
  { crate = "getrandom", wrappers = ["whiteboard-daemon", "whiteboard-worker", "jobserver", "rand", "whiteboard-proptest"], reason = "randomness is a port (IdMint); core is seeded" },
  { crate = "rand", wrappers = ["proptest"], reason = "test randomness only, for the property runner" },
  { crate = "proptest", wrappers = ["whiteboard-proptest"], reason = "every property goes through the one prelude (QR-14b)" },
]
# serde_json's recursion limit (128 levels) is part of every JSON entry's
# depth cap (crates/input-caps.json); `unbounded_depth` removes it, so one
# nested request overflows the stack — the wasm stack is 1 MiB. And
# `arbitrary_precision` changes what a number IS for every crate in the
# graph (feature unification), so a value would no longer round-trip the way
# the TypeScript oracle's JSON.parse does.
features = [
  { crate = "serde_json", deny = ["unbounded_depth", "arbitrary_precision"] },
]

# crates.io and nothing else: no git dependency, no other registry. A crate
# arriving from anywhere else (a fork, a typosquat's mirror) fails here;
# crates.io itself is the only place a dependency can come from, and a new
# one is reviewed against its entry in crates/architecture-map.json.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
