# SonarQube Cloud analysis, driven by .github/workflows/sonarqube.yml.
#
# The lane is REPORT-ONLY: nothing here gates a merge (ci-gate is the one
# required check, and this workflow is not among its `needs`). What it adds
# that no existing gate can see is duplication, the maintainability/complexity
# ratings, and coverage tracked over time — biome, knip, arch-lint, CodeQL and
# Stryker cover the rest between them.
#
# projectKey / organization are what SonarQube Cloud generates when a GitHub
# repository is imported (<owner>_<repo> and the GitHub login). Changing either
# starts a NEW project with no history, so treat them as fixed.
sonar.projectKey=kamiazya_whiteboard
sonar.organization=kamiazya
sonar.sourceEncoding=UTF-8

# Tests live beside the sources they cover in this repo, so the split is by
# FILENAME rather than by directory: everything is a source, and the patterns
# below reclassify the test files. Keeping them classified as tests is what
# stops a test's own complexity and duplication from being reported as
# production debt.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.mts,**/*.test.mjs,**/*.bench.ts,tests/**

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/tmp/**,\
  **/coverage/**,\
  **/*.d.ts,\
  apps/web/public/**,\
  packages/canvas-render/src/vendor/**,\
  docs/**

# Vendored third party is not this project's code to answer for in a
# duplication report either.
sonar.cpd.exclusions=packages/canvas-render/src/vendor/**

# One merged lcov from every non-browser vitest project
# (tools/checks/src/run-coverage.mjs). The browser projects are deliberately
# not measured: their v8 coverage is charged to a page rather than to the
# module graph, and the job would need Playwright and a real Chrome to say so.
sonar.javascript.lcov.reportPaths=tmp/coverage/lcov.info

# What `pnpm coverage` MEASURES is each package's own src/ — and nothing else.
# A file with no lcov record is reported as uncovered, not as unmeasured, so
# every analysed file outside that set has to be named here or it drags the
# coverage number down and fails the gate for being untested when it is not:
# run-coverage.mjs is exercised by four cases in vitest-projects.test.ts and
# still showed 0.0% coverage on new code, which is what prompted this list.
#
# Everything below is still fully analysed for bugs, smells and duplication.
# Only the coverage METRIC skips it.
#
# What this list does NOT do is rescue a UI change: apps/web's browser projects
# are not measured at all, so a change under components/ or pages/ reports a low
# new-code coverage however thoroughly a real browser covers it. That condition
# is read and ignored on such a PR rather than configured around — the reasoning,
# and the two alternatives that were rejected, are in docs/contributing/testing.md.
#
# ponytail: enumerated, and it drifts when a new root-level config file or
# scripts/ directory appears. The complement — measure everything, or express
# "only */src/**" — is not available: Sonar has no coverage.inclusions and its
# path patterns have no negation. A test asserting this list still covers the
# tree is the upgrade path if it ever drifts wrong.
sonar.coverage.exclusions=\
  **/*.d.ts,\
  .claude/**,\
  **/scripts/**,\
  tools/*.mjs,\
  tools/checks/**,\
  **/*.config.ts,\
  **/*.config.mjs,\
  **/vite-*.ts,\
  **/vitest.*.ts,\
  apps/web/src/test-utils/browser-setup.ts,\
  apps/web/renderer-build-id.ts,\
  apps/web/worker-safe-deps-alias.ts,\
  packages/canvas-render/stryker-targets.mjs,\
  packages/canvas-render/src/vendor/**

# ---------------------------------------------------------------------------
# Triaged vulnerabilities, recorded HERE rather than clicked "won't fix" in
# the SonarQube UI — so each decision carries a reason, sits in git, and is
# reviewed like any other change. All 35 open VULNERABILITY findings were
# read one at a time on 2026-09-21; every one of them is a rule firing on a
# context it does not fit.
#
# Each entry is scoped to the PATHS where its reasoning holds. A real
# instance of the same rule anywhere else still reports, which is the whole
# point of not silencing the rule globally.
# ---------------------------------------------------------------------------
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14

# S4036 — "searching OS commands in PATH is security-sensitive". Resolving
# `npm`, `docker` or `node` through PATH is how a build script finds its
# toolchain; absolute paths would break nvm, pnpm shims and every machine
# whose layout differs from the author's. Scoped to scripts and the smoke
# implementations, never to a server request path.
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.e1.resourceKey=**/scripts/**
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.smoke-impl.ts
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.distribution-impl.ts
sonar.issue.ignore.multicriteria.e4.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.e4.resourceKey=tools/checks/**
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.e5.resourceKey=apps/web/renderer-build-id.ts

# S5332 — "using http is insecure". The flagged string is a Playwright ROUTE
# PATTERN (`page.route('http://**', …)`) whose job is to INTERCEPT plain-http
# requests so the widget smoke can assert none are made. The rule reads it
# backwards: this is the assertion that nothing leaves over http.
sonar.issue.ignore.multicriteria.e6.ruleKey=javascript:S5332
sonar.issue.ignore.multicriteria.e6.resourceKey=packages/canvas-viewer/scripts/smoke-widget.mjs

# S2083 / S6549 — path traversal and filesystem oracle. Both are dev/CI
# scripts reading a path out of their OWN argv or env. The "untrusted input"
# is the developer running them; there is no trust boundary to cross.
sonar.issue.ignore.multicriteria.e7.ruleKey=jssecurity:S2083
sonar.issue.ignore.multicriteria.e7.resourceKey=apps/web/scripts/**
sonar.issue.ignore.multicriteria.e8.ruleKey=jssecurity:S6549
sonar.issue.ignore.multicriteria.e8.resourceKey=apps/web/scripts/**

# S8348 — "CORS injection". The file is a deliberately fully permissive probe
# server, and says so at the top: it reflects any Origin precisely so that
# engine-level gating, and not this repo's own guards, is the only variable
# the Local Network Access measurement changes.
sonar.issue.ignore.multicriteria.e9.ruleKey=jssecurity:S8348
sonar.issue.ignore.multicriteria.e9.resourceKey=packages/mcp-server/scripts/smoke/mcp-lna-transport-smoke.mjs

# S8701 / S8705 / S8707 — command and argument injection, path traversal.
# `pty-broker.py` allocates a pty and execs the argv it was handed; running
# the given command IS the script, the way `env` or `script(1)` is. It uses
# `os.execvp` with an ARRAY, so no shell parses anything, and it confers no
# privilege a caller did not already have — anyone who can run the broker can
# run the command directly.
#
# Spelled out rather than `pythonsecurity:S87*`: a ruleKey wildcard that did
# not match would silently exclude nothing, and a triage that quietly fails
# is worse than no triage.
sonar.issue.ignore.multicriteria.e10.ruleKey=pythonsecurity:S8701
sonar.issue.ignore.multicriteria.e10.resourceKey=packages/mcp-server/scripts/dev/pty-broker.py
sonar.issue.ignore.multicriteria.e11.ruleKey=pythonsecurity:S8705
sonar.issue.ignore.multicriteria.e11.resourceKey=packages/mcp-server/scripts/dev/pty-broker.py
sonar.issue.ignore.multicriteria.e12.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.e12.resourceKey=packages/mcp-server/scripts/dev/pty-broker.py

# S2871 — "provide a compare function that depends on String.localeCompare".
# Every one of the 34 sites this fired on sorts IDENTIFIERS: ULIDs, tool and
# document ids, file paths, object keys, census paths, graph edges, icon
# names. A bare `.sort()` orders those by UTF-16 code unit, which is exactly
# what a canonical order wants — and the suggested `localeCompare` reads the
# runtime's default locale and ICU data, so the same input would order
# differently on two machines. Taking the advice would introduce the defect
# the rule is shaped to prevent, which is why this is an exclusion and not a
# sweep.
#
# It is repo-wide rather than per-file because the criterion is about what is
# being sorted, not where: this codebase has no user-facing sort that goes
# through a bare `.sort()` — every list a person reads is ordered by an
# explicit comparator already. Re-check that before assuming it still holds.
#
# Where the code-unit order is load-bearing enough that a reader must not have
# to infer it — a content digest, a scene digest, a render-key axis, a query
# hash — the sort passes a named `byCodeUnit` comparator instead (c7ed9f4e).
# That is the convention for a new site whose ORDER IS ITS OUTPUT; it is not
# something to retrofit onto the sites above, where the order is internal.
sonar.issue.ignore.multicriteria.e13.ruleKey=typescript:S2871
sonar.issue.ignore.multicriteria.e13.resourceKey=**/*
sonar.issue.ignore.multicriteria.e14.ruleKey=javascript:S2871
sonar.issue.ignore.multicriteria.e14.resourceKey=**/*

# DELIBERATELY NOT excluded, so they keep reporting:
#   typescript:S2245 (x3) — `String(Math.random())` is a fallback element id
#     where `crypto.randomUUID` is absent. Not a secret, so not the security
#     problem the rule names, but a weak id generator is worth someone
#     looking at rather than silencing.
#   githubactions:S6505 (x1) — `npx` runs a package's lifecycle scripts. The
#     version is exact-pinned (`wrangler@4.105.0`) and the step holds deploy
#     secrets; the residual risk is real even though the pin addresses the
#     larger half.
