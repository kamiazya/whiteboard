# SonarQube Cloud analysis, driven by .github/workflows/sonarqube.yml.
#
# The lane is REPORT-ONLY: nothing here gates a merge (ci-gate is the one
# required check, and this workflow is not among its `needs`). What it adds
# that no existing gate can see is duplication, the maintainability/complexity
# ratings, and coverage tracked over time — biome, knip, arch-lint, CodeQL and
# Stryker cover the rest between them.
#
# projectKey / organization are what SonarQube Cloud generates when a GitHub
# repository is imported (<owner>_<repo> and the GitHub login). Changing either
# starts a NEW project with no history, so treat them as fixed.
sonar.projectKey=kamiazya_whiteboard
sonar.organization=kamiazya
sonar.sourceEncoding=UTF-8

# Tests live beside the sources they cover in this repo, so the split is by
# FILENAME rather than by directory: everything is a source, and the patterns
# below reclassify the test files. Keeping them classified as tests is what
# stops a test's own complexity and duplication from being reported as
# production debt.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.mts,**/*.test.mjs,**/*.bench.ts,tests/**

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/tmp/**,\
  **/coverage/**,\
  **/*.d.ts,\
  apps/web/public/**,\
  packages/canvas-render/src/vendor/**,\
  docs/**

# Vendored third party is not this project's code to answer for in a
# duplication report either.
sonar.cpd.exclusions=packages/canvas-render/src/vendor/**

# One merged lcov from every non-browser vitest project
# (tools/checks/src/run-coverage.mjs). The browser projects are deliberately
# not measured: their v8 coverage is charged to a page rather than to the
# module graph, and the job would need Playwright and a real Chrome to say so.
sonar.javascript.lcov.reportPaths=tmp/coverage/lcov.info
