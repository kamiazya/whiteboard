# cargo-about: the THIRD-PARTY-NOTICES shipped beside each artifact,
# generated by `cargo xtask notices`. `accepted` is deny.toml's
# [licenses] allow list, and must stay equal to it (an xtask test fails
# when they differ): a license the supply-chain gate admits is one the
# notices can carry.
accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
# This repository's own crates are all `publish = false`; they are the
# work the notices are attached to, not third parties.
private = { ignore = true }
# Dev-dependencies never reach an artifact. Build dependencies (proc
# macros, build scripts) are kept: their generated code does.
ignore-dev-dependencies = true
