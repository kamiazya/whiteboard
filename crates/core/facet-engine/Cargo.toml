[package]
name = "whiteboard-facet-engine"
description = "The facet engine's asset shapes (theme tokens, icons, stencils), generated from contracts/facets/engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
whiteboard-model = { path = "../model" }

# The recorded oracle and the contracts are read as JSON; no shipped code does.
[dev-dependencies]
serde_json.workspace = true
whiteboard-proptest = { path = "../../testing/proptest" }

# QR-21 layer 3: the same tests run natively and on wasm32 under Node.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true

[lints]
workspace = true
