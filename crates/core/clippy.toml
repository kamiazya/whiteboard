# The core layer's bans. Core runs unchanged on wasm32 and native and does no
# I/O, and the TypeScript oracle is compared byte for byte, so anything that
# reaches the OS, reads a clock, iterates in hash order or rounds differently
# per platform is refused here. `std::fs` and friends COMPILE on
# wasm32-unknown-unknown and fail only at runtime, which is why this list
# exists beside the wasm import scan rather than being replaced by it.
#
# This file replaces `crates/clippy.toml` for every crate under `crates/core`
# (clippy reads the nearest one), so the test allowances are repeated.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

disallowed-types = [
  { path = "std::collections::HashMap", reason = "hash iteration order is randomized; use IndexMap or BTreeMap" },
  { path = "std::collections::HashSet", reason = "hash iteration order is randomized; use IndexMap or BTreeMap" },
  { path = "std::fs::File", reason = "core is pure: I/O goes through a port" },
  { path = "std::fs::OpenOptions", reason = "core is pure: I/O goes through a port" },
  { path = "std::fs::DirEntry", reason = "core is pure: I/O goes through a port" },
  { path = "std::net::TcpStream", reason = "core is pure: I/O goes through a port" },
  { path = "std::net::TcpListener", reason = "core is pure: I/O goes through a port" },
  { path = "std::net::UdpSocket", reason = "core is pure: I/O goes through a port" },
  { path = "std::process::Command", reason = "core is pure: I/O goes through a port" },
  { path = "std::process::Child", reason = "core is pure: I/O goes through a port" },
  { path = "std::thread::Thread", reason = "core is single-threaded; concurrency lives in the bindings" },
  { path = "std::thread::JoinHandle", reason = "core is single-threaded; concurrency lives in the bindings" },
  { path = "std::time::SystemTime", reason = "time is a port (Clock); core never reads a clock" },
  { path = "std::time::Instant", reason = "time is a port (Clock); core never reads a clock" },
]

