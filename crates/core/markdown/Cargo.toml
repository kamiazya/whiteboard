[package]
name = "whiteboard-markdown"
description = "CommonMark, GFM and math markdown parsed to an mdast tree: a vendored, trimmed and hardened copy of markdown-rs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# Our changes are Apache-2.0 like the workspace; the vendored code is MIT and
# keeps its notice in LICENSE-markdown-rs.
license = "Apache-2.0 AND MIT"
repository.workspace = true
publish.workspace = true

[dependencies]

[dev-dependencies]
serde_json.workspace = true
whiteboard-proptest = { path = "../../testing/proptest" }

# QR-21 layer 3: the same tests run natively and on wasm32 under Node.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true

[lints]
workspace = true
