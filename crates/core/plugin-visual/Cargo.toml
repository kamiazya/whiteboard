[package]
name = "whiteboard-plugin-visual"
description = "The bundled visual plugin's facet payloads, generated from contracts/facets/visual."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["emoji-search"]
# What a document showing an emoji is found by (`emoji_search`), with its
# 180 KB term table. Off in the shipped wasm artifact (its dependents there
# take no default features), which searches through `whiteboard-search` with
# the host's expander; a second caller of the shortcode scan would change how
# that artifact inlines it.
emoji-search = []

[dependencies]
unicode-segmentation.workspace = true
whiteboard-det = { path = "../det" }
whiteboard-facet-engine = { path = "../facet-engine" }
whiteboard-model = { path = "../model" }
whiteboard-scene = { path = "../scene" }

# The manifest test reads the instance and its contract as JSON; no shipped
# code does.
[dev-dependencies]
serde_json.workspace = true

# QR-21 layer 3: the same tests run natively and on wasm32 under Node.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true

[lints]
workspace = true
