[package]
name = "whiteboard-wasm"
description = "The wasm-bindgen composition root for the browser and Node."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json.workspace = true
wasm-bindgen.workspace = true
whiteboard-codec = { path = "../../core/codec" }
whiteboard-det = { path = "../../core/det" }
whiteboard-facet-engine = { path = "../../core/facet-engine" }
whiteboard-model = { path = "../../core/model" }
whiteboard-edge-routing = { path = "../../core/edge-routing" }
whiteboard-plugin-visual = { path = "../../core/plugin-visual" }

[features]
# The per-module exports the layer-2 differentials call. Off in every shipped
# artifact; `cargo xtask dist wasm --oracle` builds the test lanes' artifact.
oracle-surface = []

[lints]
workspace = true
