<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whiteboard</title>
    <meta
      name="description"
      content="A collaborative whiteboard for you and your AI agent — draw together on a shared real-time canvas from Claude Code, Codex, or Gemini CLI."
    />
    <!-- Browser chrome tint follows the app ground per scheme (see index.css). -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)" />
    <!-- Link previews (Slack/X/Discord). og:image must be an absolute URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Whiteboard" />
    <meta
      property="og:description"
      content="A collaborative whiteboard for you and your AI agent — draw together on a shared real-time canvas."
    />
    <meta property="og:url" content="https://kamiazya-whiteboard.pages.dev/" />
    <meta property="og:image" content="https://kamiazya-whiteboard.pages.dev/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Whiteboard" />
    <meta
      name="twitter:description"
      content="A collaborative whiteboard for you and your AI agent — draw together on a shared real-time canvas."
    />
    <meta name="twitter:image" content="https://kamiazya-whiteboard.pages.dev/og-image.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      Boot splash: the only UI that exists before the app bundle (and the
      vendored viewer font main.tsx awaits) has loaded, so it must be inline
      CSS + markup — index.css and the theme class are not applied yet.
      CSS-only on purpose: the production CSP allows inline styles but not
      inline scripts, so the persisted-theme override cannot run this early;
      prefers-color-scheme covers the default 'system' preference, and
      main.tsx applies the stored class before React paints anything else.
      Colors mirror index.css --background/--border for both schemes so the
      splash-to-app handoff does not shift the ground color.
    -->
    <style>
      :root {
        --wb-boot-bg: oklch(1 0 0);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --wb-boot-bg: oklch(0.145 0 0);
        }
      }
      .wb-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--wb-boot-bg);
      }
    </style>
  </head>
  <body>
    <!-- Inside #root so React's first commit replaces it — no removal code.
         The animated mark (pen stroke drawing itself + wordmark) is the
         shared external SVG public/boot-splash.svg — same file the README
         embeds — with its animation and reduced-motion guard inside. -->
    <div id="root"><div class="wb-boot" role="status" aria-label="Loading Whiteboard"><img src="/boot-splash.svg" alt="" width="320" height="225" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
