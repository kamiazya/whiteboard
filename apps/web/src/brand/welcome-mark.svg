<svg xmlns="http://www.w3.org/2000/svg" width="132" height="84" viewBox="0 0 88 56" fill="none" data-mark="welcome" aria-hidden="true">
  <!--
    Onboarding hero (BRAND.md): the signature at greeting size, drawing
    itself once on mount (wb-scribble one-shot) - the first page is where
